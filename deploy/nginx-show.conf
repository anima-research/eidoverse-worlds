# eidoverse-worlds — show-night front: TLS + WS pass-through + asset pull-through cache.
#
# Why this exists: 200 cold clients × N user-generated avatars must not fan out
# to the Bun sequencer. Assets are content-addressed (store/<hash>.glb) or
# version-stamped (?v=mtime), so the sequencer already serves them with
# `Cache-Control: immutable`. nginx honors those upstream headers:
#   - immutable assets  → cached on this box's disk, one upstream fetch total
#     (proxy_cache_lock: the other 199 requesters wait for that one fetch)
#   - mutable avatars (.vrm without ?v) → upstream says no-cache → passed
#     through untouched, ETag 304s keep revalidation cheap. Live avatar
#     updates keep working THROUGH the cache. Do not add proxy_cache_valid
#     overrides — they would defeat exactly this.
#
# Install (borgs or any deb-ish box):
#   sudo mkdir -p /var/cache/nginx/eido && sudo chown www-data /var/cache/nginx/eido
#   sudo cp deploy/nginx-show.conf /etc/nginx/sites-available/eido-show.conf
#   # edit server_name + cert paths; certbot --nginx if no certs yet
#   sudo ln -sf ../sites-available/eido-show.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

proxy_cache_path /var/cache/nginx/eido levels=1:2 keys_zone=eido_assets:50m
                 max_size=10g inactive=7d use_temp_path=off;

server {
  listen 443 ssl http2;
  server_name SHOW_HOSTNAME_HERE;   # e.g. show.animalabs.ai
  ssl_certificate     /etc/letsencrypt/live/SHOW_HOSTNAME_HERE/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/SHOW_HOSTNAME_HERE/privkey.pem;

  client_max_body_size 35m;         # uploads: sequencer enforces its own 30MB cap

  # realtime: websocket straight through, long-lived
  location /ws {
    proxy_pass http://127.0.0.1:8940;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;   # upload rate limits key on IP
    proxy_read_timeout 4h;                     # a show is long; don't idle-kill the audience
    proxy_send_timeout 4h;
  }

  # asset library: cache what upstream declares cacheable (see header comment)
  location /library/ {
    proxy_pass http://127.0.0.1:8940;
    proxy_cache eido_assets;
    proxy_cache_key $uri$is_args$args;         # ?v=mtime mints a fresh cache entry
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;              # big VRM first-fetch can be slow
    proxy_cache_revalidate on;                 # stale entries revalidate via ETag, not re-download
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache $upstream_cache_status; # HIT/MISS visible in devtools — day-3 verification
  }

  # client modules (three.webgpu.js etc.): same treatment
  location /node_modules/ {
    proxy_pass http://127.0.0.1:8940;
    proxy_cache eido_assets;
    proxy_cache_key $uri;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    add_header X-Cache $upstream_cache_status;
  }

  # /snap holds the request open, sending nothing, while the world finds a
  # renderer: a roaming one's journey (up to 25s), then its first frame (40s, or
  # SNAP_TIMEOUT_SEC; server/config.ts). nginx's 60s default read timeout cut the
  # longest of those waits. 300s is above the sequencer's own cap on the request
  # (255s), so the answer is always the sequencer's.
  location = /snap {
    proxy_pass http://127.0.0.1:8940;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
  }

  # everything else (index, main.js, /avatars, /upload): no caching —
  # main.js staleness is exactly the ghost-bug class the server guards against
  location / {
    proxy_pass http://127.0.0.1:8940;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
