<title>eidoverse-worlds</title>
<style>
/* (moved 10-11: these rules had been appended INSIDE the favicon's data-URL <style> at line 9, so none of them applied:
   the profile name control, the Add Component band, the provenance pills; R saw "draftMaterial" in one grey) */
/* the name in the profile header is the control (R 10-11): text until you point at it */
.pf-name { all: unset; font-weight: 700; cursor: pointer; border-radius: 4px; padding: 0 3px; margin-left: -3px; }
.pf-name:hover, .pf-name:focus-visible { background: rgba(255,255,255,.08); box-shadow: inset 0 -1px 0 var(--brand, #7cf); }
.pf-rename-dlg { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; background: rgba(0,0,0,.45); }
.pf-rename-card { width: min(380px, calc(100vw - 32px)); padding: 16px 18px; border-radius: 10px; }
.pf-rename-card h3 { margin: 0 0 8px; font-size: 15px; }
.pf-rename-card p { margin: 0 0 10px; font-size: 12.5px; line-height: 1.45; opacity: .85; }
.pf-rename-in { width: 100%; box-sizing: border-box; font: inherit; font-size: 14px; padding: 6px 8px; margin: 2px 0 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.25); color: inherit; }
.pf-rename-in:focus { outline: none; border-color: var(--brand, #7cf); }
.pf-rename-warn { color: var(--warn, #e0a33a); opacity: 1 !important; }
.pf-rename-err { color: #ff7a7a; }
.pf-rename-btns { display: flex; justify-content: flex-end; gap: 8px; }
.pf-rename-btns button { font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 6px; cursor: pointer; border: 1px solid rgba(255,255,255,.18); background: transparent; color: inherit; }
.pf-rename-ok { background: var(--brand, #7cf) !important; color: #0b0d10 !important; border-color: transparent !important; font-weight: 600; }
.pf-rename-ok:disabled { opacity: .45; cursor: default; }
/* a long info value: cut with an ellipsis, whole on hover, unfolded on click (R 10-11) */
.sp-info.sp-info-long { cursor: pointer; }
.sp-info.sp-info-open { white-space: normal; overflow: visible; text-overflow: clip; word-break: break-word; }
/* the icon buttons on the name line: the glyph centred, accent-blue when switched on (R 10-11) */
.frame.edit .sp-row.sp-iconbtn .sp-btn.on, .frame.edit .sp-row.sp-iconbtn .sp-btn.on:hover { color: var(--e-accent, #4a9eff); }
.frame.edit .sp-row.sp-iconbtn .sp-btn svg { display: block; }
/* Add Component… / Add Script…: Blender's Add Modifier, a filled band that heads the component list, not a footnote to Transform */
.frame.edit .sp-row.sp-add { margin-top: 10px; }
.frame.edit .sp-row.sp-add .sp-btn, .frame.edit .sp-row.sp-add > button { background: color-mix(in srgb, var(--e-accent, #4a9eff) 22%, transparent); border-color: color-mix(in srgb, var(--e-accent, #4a9eff) 45%, transparent); color: var(--e-text); font-weight: 600; }
.frame.edit .sp-row.sp-add .sp-btn:hover, .frame.edit .sp-row.sp-add > button:hover { background: color-mix(in srgb, var(--e-accent, #4a9eff) 34%, transparent); }
/* a card's provenance pill, at the front of its title (R 10-11) */
.sp-pill { display: inline-block; margin: 0 6px 0 1px; padding: 0 6px; border-radius: 999px; font-size: 10px; font-weight: 600; line-height: 15px; letter-spacing: .02em; text-transform: uppercase; vertical-align: 1px; }
.sp-pill-draft { background: color-mix(in srgb, #e0a33a 22%, transparent); color: #e0a33a; box-shadow: inset 0 0 0 1px color-mix(in srgb, #e0a33a 55%, transparent); }
.sp-pill-foreign { background: transparent; color: var(--e-dim, #999); box-shadow: inset 0 0 0 1px currentColor; }
.sp-pill-trusted { background: color-mix(in srgb, #4a9ee8 22%, transparent); color: #4a9ee8; box-shadow: inset 0 0 0 1px color-mix(in srgb, #4a9ee8 55%, transparent); }
/* ===========================================================================
   DESIGN TOKENS — the one block that owns the client's whole look.
   Modding the UI's colors = editing (or live-overriding) THIS BLOCK ONLY;
   every rule below and every JS-drawn glyph reads these, never raw hex.

   ROLES:
   · brand    = identity & liveness ONLY: the ∃, connection state, "this is
                on/present". Never decoration.
   · attn     = "needs YOUR attention": mentions, edit-mode, unsaved, mic-hot.
                One warm amber — complements brand, colorblind-separable.
   · ink ladder (fg/dim/icon) = content: primary text, labels/hints, glyphs.
   · surfaces (panel/chip/well) = material. hover/active whites = interaction
                feedback only.
   · err      = failures only, never attention.
   =========================================================================== */
:root {
  --bg:        #0c0c0d;
  /* --panel-a is the opacity fallback dial (visionOS "Tinted" lesson):
     glass legibility collapses over bright scenes, so the floor is one
     user-ownable number away. /panels <0.3-1> sets it, persisted. */
  --panel-a:   0.7;
  /* --xr-panel-a is the VR quads' panel alpha (Settings › Style › VR panel
     opacity; domquad.js). 1 = opaque, as VR panels always were: a quad has
     no viewport under it for the desktop's glass to tint. */
  --xr-panel-a: 1;
  --panel-rgb: 5 20 20;    /* deep-ocean teal — saturated dark that the brand seafoam sits IN, not ON */
  --panel:     rgb(var(--panel-rgb) / var(--panel-a));
  --chip:      rgb(0 0 0 / .62);       /* tabs & floating chips */
  --well:      rgb(0 0 0 / .4);        /* inputs, pressed-in states */
  --edge:      rgb(255 255 255 / 0.10);
  --edge-hi:   rgb(255 255 255 / 0.32);
  --rim:       inset 0 1px 0 rgb(255 255 255 / .09);  /* the top gleam */
  --hov:       rgb(255 255 255 / .06);
  --act:       rgb(255 255 255 / .10);
  --fg:        #ebebe9;
  --dim:       #97979b;
  --icon:      color-mix(in srgb, var(--brand) 55%, #c2c2c6);  /* icons carry a whisper of the brand (derived: follows the picker); base kept light so idle dock icons don't read muddy next to the lit state */
  --brand:     #8fe8c8;   /* THE seafoam — the only one; everything below derives */
  --brand-deep: color-mix(in srgb, var(--brand) 84%, #1a2a28);  /* the ∃ at rest when live */
  --attn:      #ffc46b;   /* THE attention amber — the only one */
  --err:       #ff8f8f;
  /* in-world affordance PILLS (nameplate, speaking mic, typing dots, bubbles):
     light-on-dark, derived from the accent by default so a restyle carries
     them — but their own names, so a light menu mode could leave them dark
     (live, 09-05 16:41). Read by the sprite painters (tokv) and repainted on
     'style' events. */
  --pill-bg:   rgb(8 20 28 / .86);
  --pill-edge: color-mix(in srgb, var(--brand) 25%, transparent);
  --pill-fg:   #e8f4ef;
  --pill-dim:  #8ba39c;
  --pill-dot:  color-mix(in srgb, var(--brand) 85%, white);
  --pill-name: var(--brand);
  --ok:        var(--brand);            /* 'running / fine' — the brand, never a third green */
  --ink-on-brand: #0f2024;               /* dark ink for text/edges drawn ON a brand-filled chip */
  /* legacy aliases — keep working, point at roles */
  --accent:    var(--attn);
  --accent-dk: #382a1a;
  --control:   var(--brand);
  --warn:      var(--attn);
  --ping:      var(--attn);

  --r:         10px;
  --shadow:    0 8px 28px var(--well);
  --font:      ui-sans-serif, system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-code: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --fs:        14px;
  --fs-sm:     12px;
  --fs-xs:     11px;   /* the ONE small size for chrome captions — tiles, chips, readouts (live, 09-05: unify the scales) */
  --speed:     .16s;
}
@media (prefers-reduced-motion: reduce) {
  :root { --speed: 0s; }
  * { animation: none !important; }
}

html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
/* Cursors stay native except the loupe: ui.js generates an SVG loupe tinted
   by the LIVE --brand (CSS url() can't read vars) and publishes it as
   --cur-loupe; the rule falls back to the native cursor until then. */
button, .btn, select, a, label, .mrow, .mpin, .dbg-row, .ps-row, .card,
.ac-row, .chat-gear, .fr-btn, .chat-tabs button,
.chat-side-tog, .sp-skip { cursor: pointer; }
body.loupe-on canvas { cursor: var(--cur-loupe, crosshair); }
/* ONE house scrollbar — the standard properties, nothing else. On Chromium,
   scrollbar-width:thin DISABLES the ::-webkit-scrollbar pseudos, so what
   renders is the NATIVE thin overlay bar reading scrollbar-color; pseudo
   rules here would be dead code. */
* { scrollbar-width: thin; scrollbar-color: var(--edge) transparent; }
body { font: var(--fs)/1.5 var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; }
canvas { display: block; touch-action: none; }

.panel {
  background: var(--panel);
  border: none;
  border-radius: var(--r);
  /* rim-light: glass catching light on its top edge — surfaces separate by
     elevation + gleam, never by outline (border study C) */
  /* shadow is a STATE, not decoration: near-flat at rest — games
     separate surfaces by fill + gleam, not by OS paper-stack shadows — and
     the .lifting rule below restores real depth only while a frame is HELD */
  box-shadow: 0 1px 5px rgb(0 0 0 / .28);
  transition: box-shadow .25s ease;
  backdrop-filter: blur(16px) saturate(1.15);
  -webkit-backdrop-filter: blur(16px) saturate(1.15);
}
.frame.lifting { box-shadow: 0 12px 32px rgb(0 0 0 / .5); }
/* the rim rides an overlay so it gleams OVER header chips too —
   inset box-shadow paints under children, so light "behind" the title read
   wrong; glass catches light on its whole top edge, contents included */
/* no browser-default 13.33px anywhere in a frame: buttons inherit the house size */
.frame button:not(.tile), .frame input { font-size: var(--fs-sm); font-family: var(--font); }
.frame::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  box-shadow: var(--rim); pointer-events: none; z-index: 30;
}
/* code stays mono; prose is prose */
textarea, code, pre { font-family: var(--font-code); }

button, .btn {
  font: var(--fs-sm)/1.4 var(--font);
  color: var(--fg);
  background: rgb(255 255 255 / 0.05);
  border: 1px solid var(--edge);
  border-radius: 5px;
  padding: 6px 9px;
  cursor: pointer;
  text-align: left;
  transition: background var(--speed), border-color var(--speed);
}
button:hover, .btn:hover { background: var(--act); border-color: var(--edge-hi); }
button:active { transform: translateY(1px); }
/* ONE unified pattern for a row of equal-width action buttons (reset/pause/copy
   etc). Menus used to hand-roll `flex:1;padding:3px 0` inline per-panel, which
   drifted (0 horizontal padding jammed the text to the edges) — this centers
   the label with the base button's own padding and shares the row
   (no per-menu handrolling; one fallback). Use `<div class="row btn-row">`. */
.btn-row { display: flex; gap: 6px; }
.btn-row > button { flex: 1; max-width: 12rem; text-align: center; padding: 5px 8px; }   /* capped: a wide frame must not stretch buttons out of proportion (live, 09-04) */
button:focus-visible { outline: 2px solid var(--edge-hi); outline-offset: 1px; }   /* the KEYBOARD focus ring — was --accent (= --attn amber), so a dock tile you had clicked lit 'needs attention' the moment you pressed Shift (owner, 09-19). Focus is not attention. */
@keyframes hud-blink { 0%, 100% { opacity: 1; } 25%, 75% { opacity: .25; } }
#xrbtn.hud-blink { animation: hud-blink .9s ease-in-out 2; }
#xrbtn.hud-absent { opacity: .38; filter: none; }   /* an absent headset's visor is DIM, not ringed — the amber ring read as 'live' (owner, 09-19) */
input:focus-visible, textarea:focus-visible { outline: 1px solid var(--edge-hi); }
button.on { background: var(--hov); border-color: var(--edge-hi); color: var(--fg); }
/* persistent MODES read as armed (live 09-07 23:25): the loupe's `on`, and a skinned dropdown whose choice isn't the default */
.frame button.mode.on, .frame button.mode.on:hover, button.mode.on, button.mode.on:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.frame .dd.set, .dd.set, .dd.set:hover { border-color: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
/* unshared local changes are pending until committed */
button.dirty { border-color: var(--warn); color: var(--warn); }

input[type=text], input[type=search], input[type=number], input:not([type]), textarea {   /* textarea too (R 10-10: World Settings' description was the browser's white box) */
  font: var(--fs-sm) var(--font);
  color: var(--fg);
  background: var(--well);
  border: 1px solid var(--edge);
  border-radius: 5px;
  padding: 6px 8px;
}
input::placeholder, textarea::placeholder { color: var(--dim); }
textarea { resize: vertical; }
select {
  font: var(--fs-xs) var(--font); background: var(--well); color: var(--fg);
  border: 1px solid var(--edge); border-radius: 5px; padding: 5px;
  max-width: 100%; min-width: 0;   /* never wider than its row (video panel clipped at the frame edge) */
  /* the popup list is the OS's: color-scheme dark makes Chrome/Edge draw it dark
     instead of white-with-a-blue-bar; option colors follow the panel. The hover
     bar inside a native popup stays the OS's — a house dropdown would need a
     custom control (live, 09-04) */
  color-scheme: dark;
}
select option { background: rgb(var(--panel-rgb)); color: var(--fg); }
select option:checked { background: var(--well); color: var(--brand); font-weight: 600; }   /* the chosen row: dark well + brand ink — the brand FILL read as a gross green against the browser's blue hover (live, 09-05) */   /* pale highlight → DARK text (live, 09-04) */
/* house dropdowns (dropdown.js): the native select stays as the value store, hidden */
select.dd-native { position: absolute !important; opacity: 0; pointer-events: none; width: 1px; height: 1px; margin: 0; }
.dd { display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 88px; max-width: 100%;
  padding: 3px 8px 3px 9px; background: var(--well); border: 1px solid var(--edge); border-radius: 6px; color: var(--fg); font-size: var(--fs-sm); cursor: pointer; text-align: left; }
.row.wide .dd { min-width: min(88px, 100%); }   /* a narrow pane (a 200 px phone frame: 7rem label + 74 px) must not push the trigger past its edge */
.dd:hover { border-color: color-mix(in srgb, var(--brand) 45%, var(--edge)); }
.dd[aria-expanded="true"] { border-color: var(--brand); }
.dd svg, .dd-caret { flex: none; color: var(--dim); }
.dd-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-pop { position: fixed; z-index: 200; display: flex; flex-direction: column; padding: 4px; gap: 1px; max-height: 260px; overflow-y: auto;
  background: rgb(var(--panel-rgb) / .96); border: 1px solid var(--edge); border-radius: 8px; box-shadow: var(--shadow); }
.dd-opt { text-align: left; padding: 5px 10px; border: none; border-radius: 5px; background: none; color: var(--fg); font-size: var(--fs-sm); cursor: pointer; }
.dd-opt:hover, .dd-opt:focus-visible { background: var(--hov, rgb(255 255 255 / .06)); outline: none; }
.dd-opt.on { background: var(--well); color: var(--brand); font-weight: 600; }
input[type=checkbox] { accent-color: var(--control); }
input[type=color] {
  width: 26px; height: 20px; padding: 0; cursor: pointer; background: none;
  border: 1px solid var(--edge-hi); border-radius: 4px;
}
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
input[type=color]::-webkit-color-swatch { border: none; border-radius: 3px; }
input[type=color]::-moz-color-swatch { border: none; border-radius: 3px; }
/* links: brand ink, quiet underline — the browser's blue was the one thing on
   screen outside the scheme (live, 09-04: "open orrery" in Conjure) */
a { color: var(--brand); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--brand) 40%, transparent); text-underline-offset: 2px; }
a:hover { color: var(--fg); text-decoration-color: var(--brand); }


/* ============================================================ splash
   Deliberately plain CSS on static markup: this has to paint the instant the
   HTML lands, BEFORE the 2.1MB engine module is even requested. Anything that
   waits for JavaScript here is showing a black page during the slowest part
   of the boot, which is exactly the problem. */
#splash {
  --sp-w: min(430px, 60vw);   /* bar + status share one width (live, 09-05: the 08-29 bar) */
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; padding: 28px; box-sizing: border-box;
  /* the ground light is .sp-rays (boot.js): soft vertical rays in the SteamVR
     key-art manner — drawn small and upscaled so nothing has an edge, the whole
     layer ramping from 0 alpha over 1.5 s so it never pops in, rAF-driven so a
     frozen page freezes it. The static gradient stays UNDER it as the floor. */
  background: var(--bg);   /* the ground light is the worker's breathing gradient (.sp-rays); no CSS copy underneath or it doubles */
  transition: opacity .6s ease, visibility .6s;
  font: var(--fs)/1.6 var(--font); color: var(--fg);
}
#splash.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.sp-rays { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; display: block; z-index: 0; }
#splash > :not(.sp-rays) { position: relative; z-index: 1; }
/* THE MARK HOLDS (live, 09-05 17:41: "I keep feeling unsure about it and that's
   usually a sign I'm trying too hard"). Two motions were removed here — the old
   ∃'s three strokes assembling with load progress, and a compositor-side opacity
   breath — plus the finish glow. ONE motion came back with the new mark (owner,
   09-29 23:53): the PEG enters from the sphere's left skin, through the doorway,
   and comes to rest at 100% — it IS the progress (boot.js paint(), eased exactly
   as the logo notes' splash/doorway.html). Nothing else moves: the frame stands
   at full strength from the first paint, and once loaded the mark is the still
   mark (no transform, no clip). The other moving thing is the ground light
   (.sp-rays, worker-driven): it means "alive"; the mark means "us". */
.sp-logo {
  width: 200px; height: 210px; transform: translateY(10px) scale(.4); transform-origin: center;   /* drawn 2x, shown at 0.8x (live 09-07 23:05: 'a bit too big'), nudged down onto the mark */
  margin: -52px 0 -64px; color: var(--brand); overflow: visible;
}
.sp-logo-wrap { position: relative; display: grid; place-items: center; }
.sp-peg { transition: transform .3s ease; }   /* the bar's own .3s: a jump in real progress is entered, not snapped */
@media (prefers-reduced-motion: reduce) { .sp-peg { transition: none; } }
.sp-mark {
  font-size: 26px; letter-spacing: .34em; color: var(--brand); opacity: .9;
  text-transform: lowercase; font-weight: 500; margin-left: .34em; /* recenter over tracking */
}
.sp-mark-sub {
  /* small, beneath, no fanfare: Technically Distinct while everyone gets
     used to the idea */
  font-size: 12px; letter-spacing: .58em; margin: -30px 0 0 .58em;
  color: color-mix(in srgb, var(--brand) 45%, transparent); font-weight: 400; text-transform: lowercase;
}
/* hairline: the assembly carries the feel, the line carries the certainty —
   a bar affordance gives an unambiguous DONE */
#splash .sp-bar { flex: none; width: var(--sp-w); height: 3px; border-radius: 2px; overflow: hidden; background: color-mix(in srgb, var(--brand) 12%, transparent); }
#splash .sp-bar-fill { width: 0%; height: 100%; border-radius: 2px; background: color-mix(in srgb, var(--brand) 65%, transparent); transition: width .3s ease; }
.sp-sub { color: var(--dim); font-size: var(--fs); margin: -5px 0; text-align: center; }   /* HUD body size, not a bespoke 15px (live, 09-05) */  /* equal air above + below */
.sp-sub b { color: var(--fg); font-weight: 600; }
/* one centered breath under the bar — phase and bytes are a single quiet
   line, not furniture at opposite walls */
.sp-status {
  width: var(--sp-w); display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  font-size: var(--fs); margin-top: -10px;   /* the 08-29 layout: phase under the bar's left end, bytes under its right */
}
.sp-phase { color: var(--brand); }
/* what's LOADING, by name — surfaces only when something has been in flight
   for a while (live, 09-05 17:47: VRMs take a looooong time on weak hardware and
   a bar alone says nothing). Up to two items, most-remaining first. */
.sp-items { width: var(--sp-w); min-height: 1.4em; display: flex; flex-direction: column; gap: 4px; margin-top: -8px; font-size: var(--fs-sm); color: var(--dim); font-variant-numeric: tabular-nums; }   /* two rows reserved always, so the column never jumps when names appear */
/* the VR veil (xr.js xrVeilShow): the splash's furniture over the world while a session starts or ends.
   Class-based on purpose — .sp-logo/.sp-mark/.sp-phase are global, so the veil IS the splash's look. The
   ellipsis breathes here (and only here): the veil clones the mark at rest (the peg home); a veil is a wait. */
.xr-veil {
  position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; padding: 28px; box-sizing: border-box; background: var(--bg); font: var(--fs)/1.6 var(--font); color: var(--fg);
  opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .35s ease, visibility .35s;
}
.xr-veil.on { opacity: 1; visibility: visible; pointer-events: auto; }
.xr-veil .sp-phase { font-size: var(--fs); letter-spacing: .08em; margin-top: 6px; position: relative; }
.xr-veil .sp-phase::after { content: '...'; position: absolute; left: 100%; top: 0; overflow: hidden; white-space: nowrap; width: 0; letter-spacing: .04em; animation: xr-veil-dots 1.6s steps(4, end) infinite; }   /* out of flow: the words hold still, the dots grow to the right */
@keyframes xr-veil-dots { from { width: 0; } to { width: 1.3em; } }
@media (prefers-reduced-motion: reduce) { .xr-veil .sp-phase::after { animation: none; } }
/* .sp-load, not .sp-item — that name is the schema panel's list row (padding 3px 7px), and the collision
   indented these 7 px off the status row's edge (live, 09-05 17:58: "weird having those left-justified?") */
.sp-load { display: flex; justify-content: space-between; gap: 12px; }
.sp-load .sp-load-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-load .sp-load-bytes { flex: none; }
.sp-phase::after { content: '…'; }
.sp-detail { color: var(--dim); font-variant-numeric: tabular-nums; }
.sp-why { width: var(--sp-w); font-size: var(--fs-sm); color: var(--brand); margin-top: -6px; }   /* why this load is happening (a VR reload, a backend swap) */

.sp-tip {
  display: flex; align-items: center; gap: 11px;   /* keycap centers on the tip line */
  max-width: min(500px, 88vw); font-size: var(--fs-sm); color: var(--dim);
  min-height: 44px; text-align: left;
}
.sp-tip b { color: var(--fg); font-weight: 600; }
.sp-tip .tipk {
  flex: none; width: 26px; height: 26px; border-radius: 6px;
  display: grid; place-items: center; color: var(--brand);
  background: color-mix(in srgb, var(--brand) 10%, transparent); border: 1px solid var(--edge);
}
.sp-skip {
  opacity: 0; pointer-events: none; transition: opacity .4s;
  font-size: var(--fs-sm); color: var(--dim); background: none; border: none;
}
.sp-skip.show { opacity: 1; pointer-events: auto; }
/* a refused join (boot.js refuseBoot): the splash stays and the server's sentence takes the status line — no bar,
   no bytes, no tips, no way "in anyway" to an empty world that would look like a join */
#splash.refused .sp-bar, #splash.refused .sp-detail, #splash.refused .sp-items, #splash.refused .sp-tip, #splash.refused .sp-skip { display: none; }
#splash.refused .sp-status { justify-content: center; margin-top: 0; }
#splash.refused .sp-phase { color: var(--fg); text-align: center; text-wrap: balance; }
#splash.refused .sp-phase::after { content: none; }
.sp-skip:hover { color: var(--fg); background: none; }
@media (prefers-reduced-motion: reduce) { .sp-bar-fill { transition: none; } }

/* =========================================================== frames (windows)
   Movable, resizable, collapsible, layout remembered. The scene is the
   content, so the chrome has to get out of the way on the user's terms. */
.frame {
  position: fixed; display: flex; flex-direction: column;
  z-index: 10; /* must equal Z_LO in windows.js */ min-width: 170px;   /* PRE-PAINT DEFAULT ONLY: windows.js paint() overwrites this with the frame's own minW (an inline style, so it wins). This line was a floor BENEATH the JS one and silently clipped any frame declaring less — measured: the action bar asking for 48px rendered at 170 with 4 columns. (R, 2026-09-11) */ overflow: hidden;
}
.fr-head {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 6px 5px 10px; cursor: grab;
  border-bottom: 1px solid var(--edge);
  background: rgb(0 0 0 / 0.30); flex: none;
  user-select: none; -webkit-user-select: none;
}
.fr-head:active { cursor: grabbing; }
.ui-locked .fr-head { cursor: default; }
.fr-title {
  flex: 1; font-size: var(--fs-sm); color: var(--dim);
  text-transform: uppercase; letter-spacing: .085em; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fr-badge {
  font-size: var(--fs-xs); color: var(--dim); background: rgba(0,0,0,.3);
  border-radius: 9px; padding: 0 6px; flex: none;
}
.fr-badge b { color: var(--fg); font-weight: 600; }
.fr-badge b.ping { color: var(--ping); }
.fr-btns { display: flex; gap: 2px; flex: none; }
.fr-btn {
  padding: 1px 6px; font-size: var(--fs-xs); line-height: 1.4;
  background: none; border: none; color: var(--dim);
}
.fr-btn:hover { background: var(--hov); color: var(--fg); }
.ui-locked .fr-btn { display: none; }
.fr-body { display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  /* text never touches the pane's top or bottom edge */
  padding-top: 5px; padding-bottom: 5px; }
/* scrollbars sit a couple px in from the frame edge so the scroll thumb and
   the edge-resize band don't fight over the same column */
.frame .fr-body { padding-right: 6px; }
.frame .fr-body:has(> .tiles.fixed) { padding: 7px; }   /* tile bodies pad EVENLY — the right-only scrollbar room read as a lopsided gutter (live, 09-04) */
.frame.flash { animation: flash 1.4s ease-out; }
@keyframes flash {
  0%, 100% { border-color: var(--edge); }
  15%, 55% { border-color: var(--ping); box-shadow: 0 0 0 1px var(--ping), var(--shadow); }
}

/* ------------------------------------------------------------------- chat */
.chat-frame .fr-body { padding: 0; }
.chat-cols { display: flex; flex: 1; min-height: 0; }
.chat-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; position: relative; }
.chat-side-tog {
  flex: none; width: 14px; padding: 0; display: grid; place-items: center;
  background: none; border: none; border-left: 1px solid var(--edge);
  border-radius: 0; color: var(--dim); font-size: 12px;
}
.chat-side-tog:hover { color: var(--fg); background: rgb(255 255 255 / .05); }
.chat-side-tog { display: none; }   /* the 14px strip toggler is retired (the node stays: ui.js Tab and mods address it): collapsed, the tab-row chip opens the column; open, the column's header closes it */
.chat-cols.side-closed .chat-side-tog { display: none; }   /* collapsed: no strip at all, so the chat sits centred; the tab row's presence chip opens it (R, 09-29) */   /* no pane, no grab edge, no line — on EITHER side (live 09-07: left leaked a line) */
.chat-side { flex: none; display: flex; flex-direction: column; position: relative; min-height: 0; border-left: 1px solid var(--edge); }
.chat-cols.side-left .chat-side { border-left: none; border-right: 1px solid var(--edge); }   /* the line between log and column is the column's own edge now */
.chat-side.closed { display: none; }
/* the grip straddles the LINE you can see (the toggler's border, between the log
   and the 14px strip) — it used to sit on the strip's far side, invisible (live, 09-04) */
.chat-side-grip { position: absolute; left: -5px; top: 0; bottom: 0; width: 8px; cursor: ew-resize; z-index: 3; }
/* the affordance is the LINE itself, not a band: a 1px stroke that turns brand under the pointer */
.chat-side-grip::before { content: ''; position: absolute; left: 4px; top: 0; bottom: 0; width: 1px; background: transparent; }
.chat-side-grip:hover::before, .chat-side-grip:active::before { background: var(--brand); }
.chat-side-list {
  /* A VISIBLE TRACK WHEN IT FILLS. `overflow-y: auto` was already here, but the
     platform draws an OVERLAY scrollbar — measured: 40 rows overflow 812px into
     236px and the gutter is 0px wide, so the list simply clips a row mid-height
     with nothing to say there is more (R, 2026-09-11: "make sure there's a
     scroll bar in the People Here panel when it gets enough people in it").
     scrollbar-gutter reserves the lane so the rows never reflow when it appears,
     and the thin thumb is the global one from line 91. */
  flex: 1; overflow-y: auto; scrollbar-gutter: stable; padding: 6px 4px 6px 6px;
}
.chat-side-list .who-row { display: flex; justify-content: flex-start; gap: 4px; padding: 1px 0; font-size: var(--fs-sm); }
.chat-side-list .who-row .who-mark { margin-right: 2px; }   /* + the row gap 4 → 6 px dot→name (was 15) */
.chat-side-list .who-row .d:empty { display: none; }
.chat-side-list .who-row .d { color: var(--dim); font-size: var(--fs-xs); margin-left: auto; }
.chat-side-list .who-empty { color: var(--dim); font-size: var(--fs-sm); }
.chat-side-head { flex: none; padding: 6px 6px 2px; font-size: var(--fs-xs); color: var(--dim); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
/* OPEN, the header is the column's close control: a chevron pointing at the edge it collapses to (chat.js data-chev) —
   at the header's outer end, on whichever side the column sits */
.chat-side-head[role="button"] { display: flex; align-items: center; gap: 5px; margin: 4px 4px 0; padding: 3px 6px; border-radius: 5px; cursor: pointer; }
.chat-side-head[role="button"]:hover, .chat-side-head[role="button"]:focus-visible { color: var(--fg); background: var(--hov); outline: none; }
.chat-side-head[data-chev]::after { content: attr(data-chev); margin-left: auto; font-size: 15px; line-height: 1; letter-spacing: 0; opacity: .8; }
.chat-cols.side-left .chat-side-head[data-chev]::after { content: none; }
.chat-cols.side-left .chat-side-head[data-chev]::before { content: attr(data-chev); font-size: 15px; line-height: 1; letter-spacing: 0; opacity: .8; }
.chat-cols.side-left { flex-direction: row-reverse; }
.chat-cols.side-left .chat-side-tog { border-left: none; border-right: 1px solid var(--edge); }
.chat-cols.side-left.side-closed .chat-side-tog { border-right-color: transparent; }   /* closed = no line, same as the right (live 09-07 10:55) */
.chat-cols.side-left .chat-side-grip { left: auto; right: -5px; }   /* mirror of the right: over the toggler's border line, not the pane's own edge (live, 09-06 23:34: 'the right behaviour is preferred') */
/* the gear: a settings affordance INSIDE the compose field, at its right end (its popover opens upward, chat.js) */
.chat-compose > .chat-gear {
  position: absolute; right: 11px; bottom: 10px;   /* on the compose box's last line as it grows */
  width: 24px; height: 24px; padding: 0; display: grid; place-items: center;
  background: none; border: none; color: var(--dim); border-radius: 5px;
}
.chat-compose > .chat-gear[aria-expanded="true"] { opacity: 1; color: var(--fg); background: var(--hov); }
.chat-tabs .chat-who { flex: none; min-width: 0; align-self: center; display: inline-flex; align-items: center; gap: 6px;
  margin-left: 4px; padding: 2px 8px; background: none; border: 1px solid transparent; border-radius: 999px;
  color: var(--dim); font-size: var(--fs-xs); white-space: nowrap; cursor: pointer; }
.chat-tabs .chat-who:hover { color: var(--fg); background: var(--hov); }
.chat-tabs .chat-who.at-left { margin-left: 0; margin-right: 4px; }
.chat-tabs .chat-who[hidden] { display: none; }
.chat-who .who-dots { display: inline-flex; }
.chat-who .who-dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: 0 0 0 1.5px rgb(var(--panel-rgb)), 0 0 0 2.5px var(--ok); }
.chat-who .who-dot + .who-dot { margin-left: -3px; }
.chat-who .who-dot[data-presence="away"] { box-shadow: 0 0 0 1.5px rgb(var(--panel-rgb)), 0 0 0 2.5px var(--attn); opacity: .7; }
.chat-who .who-dot[data-presence="busy"] { box-shadow: 0 0 0 1.5px rgb(var(--panel-rgb)), 0 0 0 2.5px var(--err); }
.chat-gear { opacity: .4; }   /* quieter than the tabs — it's furniture, not content */
.chat-gear:hover { opacity: 1; color: var(--fg); background: var(--hov); }
.chat-gearpop { position: absolute; z-index: 8; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; font-size: var(--fs-sm);
  /* popovers float OVER content (the chat log), so glass at --panel-a made
     them a legibility lottery — near-opaque, still following the panel hue */
  background: rgb(var(--panel-rgb) / .94); }
.chat-gearpop[hidden] { display: none; }
.chat-gearpop .gp-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.chat-gearpop .gp-row span { color: var(--dim); margin-right: 6px; }
.chat-gearpop .gp-row b { min-width: 20px; text-align: center; }
/* on/off pairs in the gear pop: on = a brand chip with dark ink, off = the well — the same
   live/idle grammar as the dock's lit icon and .sp-btn (live, 09-05: more contrast) */
.chat-gearpop .gp-row button { background: var(--well); color: var(--dim); border: 1px solid transparent; }
.chat-gearpop .gp-row button:hover { color: var(--fg); border-color: var(--edge); }
.chat-gearpop .gp-row button.on { background: var(--brand); color: var(--ink-on-brand); font-weight: 600; }
.chat-gearpop button { padding: 2px 8px; }
/* The strip has to hold `all · mentions · system` PLUS one tab per open DM, so
   the tabs can no longer share the width equally — flex:1 squeezed every tab
   thinner as conversations opened. They size to their label now and the strip
   scrolls, with arrows appearing only on overflow.
   R, 2026-09-11: "squash the words together at the top to make room for more
   tabs but still leave some buffer so they don't get too close, left/right
   arrow keys at either side of the menu if you need to side-scroll". */
.chat-tabs { display: flex; gap: 2px; padding: 7px 8px 0; flex: none; align-items: stretch; }   /* NO rail here: it ran under the arrows and gear and died at the People-Here expander. R, 2026-09-11 item 5: "crop the separator line to only be under the tabs ... look more balanced" */
.chat-tabs .tabscroll {
  display: flex; gap: 4px; flex: 1; overflow-x: auto; scrollbar-width: none;
  border-bottom: 1px solid var(--edge);   /* the rail, cropped to exactly the tabs */
  scroll-behavior: smooth;
}
.chat-tabs .tabscroll::-webkit-scrollbar { display: none; }
.chat-tabs .tabarrow {
  /* BIGGER, and with room around them. At --fs-xs in a 14px box these were
     nearly invisible next to the labels — R, 2026-09-11: "Arrow buttons should
     maybe be bigger if anything exists like that (maybe small phosphor icons,
     if there's no unicode to support something like that?)". icons.js carries
     NO caret/chevron/arrow glyph (checked, not assumed), so this stays unicode
     and gets the size instead. */
  /* min-width:0 is LOAD-BEARING: `.chat-tabs button`'s min-width matches these
     too, and .tabarrow never sets one — so without this the arrows inherit the
     tabs' floor and blow past their 16px width. Specificity does not save you
     here: the two rules never compete for the same property. */
  /* IN LINE with the tab text, not shouting over it. 15px next to 11px labels
     read as a different kind of control — R, 2026-09-11 item 3: "Make the
     side-scroll arrows bigger if it's too small (in-line with the rest of the
     tab-text". So: the tab's own size, with the box big enough to hit. */
  flex: none; width: 16px; min-width: 0; padding: 2px 0; background: none; border: none;
  color: var(--dim); font-size: var(--fs-sm); line-height: 1; cursor: pointer; border-radius: 4px;
  align-self: center;
}
.chat-tabs .tabarrow:hover { color: var(--fg); background: var(--hov); }
.chat-tabs .tabarrow[hidden] { display: none; }
.chat-tabs button {
  /* .pf-tab's recipe, kept flex so the strip still shares width evenly and still
     scrolls when it cannot. An underline says "this pane belongs to this tab"
     without needing any horizontal space of its own. */
  /* `justify-content: center` centres the label+x pair AS A UNIT, so on a
     closable tab the glyph rode out past the padding box and vanished — R,
     2026-09-11 item 2: "Make sure the 'x' is also fully visible." Measured: the
     x sat 5px beyond its own tab's right edge and did not render at all.
     Centring is right for the fixed tabs; a closable one needs the glyph to
     occupy real space, so .has-x switches to space-between and pays for it with
     a wider floor and room on the right. */
  /* GROW to share the strip, but never SHRINK below the label — both halves at
     once. A flex-basis of 0 crushes the tabs until the row cannot overflow and
     the arrows have nothing to scroll; `flex: none` stops the crushing but also
     stops them filling a wide strip. `min-width: max-content` is the floor that
     flex-basis 0 never gave us: stretch into spare room, stop at the text. */
  flex: 1 1 auto; min-width: max-content; padding: 5px 9px 6px; font-size: var(--fs-xs);
  display: flex; align-items: center; justify-content: center; gap: 4px;
  /* THE UNDERLINE LIVES INSIDE THE BOX. `margin-bottom: -1px` hangs the border
     1px past the tab, and .tabscroll is `overflow-x: auto` — an overflow box
     CLIPS its children at the padding box, so the brand underline was cut off
     every time while the grey rail underneath showed through. Isolated it: same
     markup, same -1px, `overflow: auto` -> no underline, `overflow: visible` ->
     underline. A border with no overhang has nothing to clip.
     R, 2026-09-11: "the tabs in the Profile panel have the highlight underneath,
     but the tabs in the Chat pane do not ... in which direction?" — hers, the
     Profile direction. */
  background: none; border: none; border-bottom: 1px solid transparent;
  border-radius: 6px 6px 0 0;
  color: var(--dim); white-space: nowrap; cursor: pointer;
}
.chat-tabs button:hover { color: var(--fg); background: rgb(143 232 200 / .13); }   /* the LIVELIER of the pair: hover reaches for you, selection just sits there (R, 2026-09-11: "reverse the current tab colors when hovering vs selected") */
/* a DM tab carries a visible close — right-click worked and told nobody */
.chat-tabs button .tabx {
  flex: none; margin-left: 2px; margin-right: 0; padding: 0 2px; border-radius: 4px;
  color: var(--dim); opacity: .55; font-size: var(--fs-xs); line-height: 1;
}
.chat-tabs button .tabx:hover { opacity: 1; color: var(--fg); background: var(--hov); }
.chat-tabs button.on {
  /* HIGHLIGHTED, not merely tinted. The underline alone was computed correctly
     and painted over: the tab's bottom border and the strip's rail landed on the
     SAME line (measured overlap 0px), so the parent's border won and the owner saw a
     brand-coloured word with no underline — "Leave the tab highlighted when
     active" (2026-09-11). With the rail now on .tabscroll the tab's own border
     has somewhere to sit, and a .tile.on-style wash makes the tab itself read
     as selected rather than just its text. */
  /* CHILL. A 14% brand wash won the eye away from the conversation; R,
     2026-09-11: "I prefer a more chill highlight color so it's not stealing a
     lot of attention." The pressed-in --well is this client's own idiom for a
     settled choice (.dd-opt.on, .pf-pop-row.on) — the brand stays in the text
     and the underline, which is where it carries meaning. */
  color: var(--brand); border-bottom-color: var(--brand);
  background: var(--well);
}

.chat-log {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 9px 10px; display: flex; flex-direction: column;
  user-select: text; -webkit-user-select: text;
}
.chat-log .line { padding: 1px 0; word-wrap: break-word; overflow-wrap: anywhere; }
.chat-log .line .body { white-space: pre-line; }   /* a message typed on several lines (Shift+Enter) keeps its breaks; runs of spaces still collapse */
.chat-log .line.filtered { display: none; }
.chat-log .line .t { color: var(--dim); font-size: var(--fs-xs); margin-right: 6px; opacity: .6; }
.chat-log .line .who { color: var(--fg); font-weight: 600; }
.chat-log .line .who::after { content: ':'; color: var(--dim); font-weight: 400; }
.chat-log .line .body { margin-left: 5px; }
/* Your own name now takes its participant colour like everyone else's (it must
   look the same to you as it does to them), so "this one is mine" is carried by
   a faint wash instead. .ping's background is declared later and still wins. */
.chat-log .line.me { background: rgba(255,255,255,.04); border-radius: 3px; }
.chat-log .line.declared .who[data-declares]::after { content: ' · ' attr(data-declares); color: var(--dim); font-size: var(--fs-xs); font-weight: normal; }
.chat-log .line.sys { color: var(--dim); font-style: italic; }
.chat-log .line.hist-note {
  border-bottom: 1px dashed var(--edge); padding-bottom: 4px; margin-bottom: 4px;
  font-style: normal; opacity: .8;
}
.chat-log .line.sys .who { display: none; }
.chat-log .line.sys .body { margin-left: 0; }
/* grouped continuation lines: hide the repeated name, keep the text aligned */
.chat-log .line.cont .t { visibility: hidden; font-size: var(--fs-xs); }
.chat-log .line.cont .who { display: none; }
.chat-log .line.ping {
  background: color-mix(in srgb, var(--attn) 9%, transparent);
  border-left: 2px solid var(--ping); margin-left: -10px; padding-left: 8px;
}
.chat-log .mention { color: var(--accent); background: color-mix(in srgb, var(--attn) 13%, transparent); border-radius: 3px; padding: 0 2px; }
.chat-log .mention.me { color: var(--ping); background: color-mix(in srgb, var(--attn) 18%, transparent); font-weight: 600; }
.chat-log .lnk { color: var(--accent); }

.chat-jump {
  display: none; position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%);
  z-index: 3; font-size: var(--fs-xs); padding: 3px 10px; border-radius: 11px;
  background: var(--accent-dk); border-color: var(--edge-hi); color: var(--accent);
}
.chat-jump.ping { background: var(--accent-dk); border-color: var(--ping); color: var(--ping); }

.chat-compose { position: relative; padding: 6px; flex: none; }
/* the compose box is a textarea that grows (chat.js sizeInput); it wears the text input's skin */
.chat-compose textarea {
  display: block; width: 100%; box-sizing: border-box; resize: none; overflow-y: hidden;
  font: var(--fs) var(--font); line-height: 1.35; color: var(--fg); background: var(--well);
  border: 1px solid var(--edge); border-radius: 5px; padding: 6px 32px 6px 8px;
}
.chat-compose textarea::placeholder { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.ac {
  position: absolute; left: 6px; right: 6px; bottom: calc(100% - 4px);
  max-height: 168px; overflow-y: auto; z-index: 5; padding: 3px;
}
.ac-row {
  display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  padding: 4px 7px; border-radius: 4px; cursor: pointer; font-size: var(--fs-sm);
}
.ac-row.on { background: var(--accent-dk); }
.ac-row .ac-l { color: var(--fg); white-space: nowrap; }
.ac-row.on .ac-l { color: var(--accent); }
.ac-row .ac-h { color: var(--dim); font-size: var(--fs-xs); text-align: right; overflow: hidden; }

.chat-log .line.whisper { background: rgba(160, 140, 220, .10); border-left: 2px solid #a08cdc;
  margin-left: -10px; padding-left: 8px; }
.chat-log .line.whisper .who { color: #c4b5f0; }
.chat-log .line.whisper .who::before { content: '⤷ '; }
.chat-log .line.whisper.me .who::before { content: '⤶ '; }
.chat-tabs button.has-unread { color: var(--fg); font-weight: 600; }
.chat-tabs button.has-x {
  /* A DM TAB IS SIZED BY ITS NAME, not by an equal share. `flex: 1 1 0` gave
     every tab the same width, so @Hesperus (62.8px of text) was squeezed into a
     ~56px content box and ellipsised to "@He…" — the truncation meant to be a
     last resort fired at four tabs. Content-sized with a ceiling: it takes the
     room the name needs, gives way before the fixed tabs do, and only truncates
     past 168px, where the scroller has already taken over. */
  flex: 0 1 auto; justify-content: space-between; min-width: 74px; max-width: 168px; padding-right: 5px;
}
.chat-tabs button.has-x > span:not(.tabx) {
  /* THE LABEL WAS EVICTING THE GLYPH. Measured: a 62.8px name inside a 74px tab
     whose padding leaves a ~56px content box — and `white-space: nowrap` means
     the label never yields, so the x was pushed 17px past the tab's own right
     edge and did not render. Three rounds I spent adjusting the x's margin, the
     tab's padding and justify-content: none of those were the term. A long DM
     name must TRUNCATE so the glyph keeps its place. */
  min-width: 0; overflow: hidden; text-overflow: ellipsis;
}
.chat-typing {
  display: none; padding: 0 10px 3px; font-size: var(--fs-xs); color: var(--dim);
  font-style: italic; flex: none;
}

/* ------------------------------------------------------------ panel frames */
/* World and Settings are TABBED (ui.js tabbedFrame/makeSection; owner 09-29, the A-kit mockup): the
   strip is the profile's .pf-tabs recipe, the pane is one .sec at a time. The strip tightens as the frame
   narrows (data-fit, measured in ui.js): '' full labels · compact = the chosen tab alone keeps its
   label · icons = glyphs only · then it scrolls, bar hidden. */
.tabbed { display: flex; flex-direction: column; min-height: 0; }
.pf-tabs.sec-tabs { flex: none; margin: 6px 7px 0; overflow-x: auto; scrollbar-width: none; }
.sec-tabs::-webkit-scrollbar { display: none; }
.sec-tabs .pf-tab { flex: none; white-space: nowrap; padding: 6px 8px 7px; }
.pf-tabs[data-fit="compact"] .pf-tab:not(.on):has(svg) > span,
.pf-tabs[data-fit="icons"] .pf-tab:has(svg) > span { display: none; }
.pf-tabs[data-fit="icons"] .pf-tab { padding: 6px 7px 7px; }
.sec { display: none; flex-direction: column; }
.sec.open { display: flex; }
.sec > .body { display: flex; flex-direction: column; gap: 4px; color: var(--dim); }
/* panel content hierarchy: body copy = dim; outlined buttons hug their text, never stretch the column */
.sec > .body button { align-self: flex-start; width: fit-content; }
/* Debug's tabs are TEXT, by job (debug.js dbgTabs) — the same strip, no glyphs; its groups inside a tab
   are quiet captions, not more collapsing */
.pf-tabs.dbg-tabs { margin: 0 0 6px; flex: none; overflow-x: auto; scrollbar-width: none; }
.dbg-pane { display: none; flex-direction: column; gap: 4px; }
.dbg-pane.open { display: flex; }
.dbg-group-body > button { align-self: flex-start; }   /* the panes' rule: a lone button hugs its words */
/* a caption inside a pane: groups rows without another level of collapsing (Debug's groups, the mods pane).
   It must read as the START of a sub-area (owner, 10-01: "looks nearly identical to other text"): a hairline
   above, brand-tinted capitals, more air above than below. The VR quad (htmlmesh) paints uppercase, the weight,
   the colour and a one-sided border, but not letter-spacing, so the caption holds up without the spacing. */
.dbg-group, .sec-cap { font-size: var(--fs-xs); font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--brand) 70%, var(--dim)); border-top: 1px solid var(--edge); padding-top: 7px; margin: 10px 0 2px; }
.dbg-group:first-child, .sec-cap:first-child { margin-top: 2px; padding-top: 0; border-top: 0; }
/* a list nested in a pane is not a second scroller: the frame's .stack scrolls, this one only groups */
.sec .stack { padding: 0; flex: none; min-height: auto; }
/* the mods pane (mods.js): name + what it is on the left, its control on the right; a row with several
   controls puts them under its text */
.mod-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.mod-row.stacked { flex-direction: column; align-items: stretch; gap: 4px; }
.mod-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.mod-nm { color: var(--fg); font-size: var(--fs-sm); overflow-wrap: anywhere; }
.mod-note { color: var(--dim); font-size: var(--fs-xs); line-height: 1.35; }
.mod-note.warn { color: color-mix(in srgb, var(--attn) 70%, var(--dim)); }
.mod-row > button { flex: none; }
.sec > .body .mod-btns { display: flex; flex-wrap: wrap; gap: 4px; }
.sec > .body .mod-btns > button { padding: 3px 8px; font-size: var(--fs-xs); }
.sec > .body #mod-src { font: 11px/1.4 ui-monospace, monospace; width: 100%; box-sizing: border-box; resize: vertical; }
.stack { padding: 7px; gap: 6px; display: flex; flex-direction: column; overflow-y: auto; flex: 1; min-height: 0; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
/* The body picker holds ~18 faces. Two columns made each card ~250px, so
   choosing meant scrolling past a wall of portraits. */
.grid.dense { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.grid.dense .card span { font-size: var(--fs-xs); }
.card .ph {
  width: 100%; aspect-ratio: 1; border-radius: 4px;
  background: rgba(0,0,0,.3); display: none;
  place-items: center; font-size: 26px; opacity: .35;
}
.card {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px; font-size: var(--fs-xs); line-height: 1.25; text-align: center;
  word-break: break-word; position: relative;
}
.card canvas, .card img {
  width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px;
  background: rgba(0,0,0,.35);
}
/* library filenames are SEO soup — clamp so a card stays a card */
.card span {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; width: 100%;
}
.card:hover span { -webkit-line-clamp: 4; }
.card.on { background: color-mix(in srgb, var(--brand) 18%, transparent); border-color: var(--brand); }
.card.on span { color: var(--brand); }

.row { display: flex; align-items: center; gap: 7px; font-size: var(--fs-sm); color: var(--dim); }
/* min-widths, not fixed: 'sweepPhase' overran a 42px label and '0.29411' a 34px readout (live, 09-04) */
.row .nm { min-width: 42px; max-width: 40%; flex: none; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
input[type=range] { flex: 1; accent-color: var(--control); min-width: 0;
  appearance: none; -webkit-appearance: none; height: 14px; background: none; }
/* the track joins the theme: bright-filled to the thumb, accent-flavored
   dark well after it (the value must read at a glance). WebKit has no
   native progress fill on custom tracks, so ui.js paints --p per input.
   Un-scoped from .row on 09-04: Scene's sliders live outside a .row and were browser-default. */
input[type=range] { --p: 50%; }
/* no transition on the track: its --p gradient stop would ANIMATE on release,
   fading the dark half up and back for a beat (live, 09-04). Chunkier + round ends. */
input[type=range], input[type=range]::-webkit-slider-runnable-track, input[type=range]::-webkit-slider-thumb { transition: none; }
input[type=range]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 999px;
  background: linear-gradient(to right,
    var(--control) 0 var(--p),
    color-mix(in srgb, var(--control) 14%, rgb(255 255 255 / .07)) var(--p) 100%);
  /* no border: the 'legibility' ring read as a gray outline on our dark panels
     (live, 09-04); the well after the thumb is the contrast */
  border: none; box-shadow: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
  background: var(--control); margin-top: -4px;
  border: none;
  box-shadow: 0 1px 3px rgb(0 0 0 / .45);
}
input[type=range]:hover::-webkit-slider-thumb { background: color-mix(in srgb, var(--control) 78%, white); }
input[type=range]:disabled::-webkit-slider-thumb { background: color-mix(in srgb, var(--control) 40%, #555); }
input[type=range]::-moz-range-track {
  height: 6px; border-radius: 999px;
  background: color-mix(in srgb, var(--control) 14%, rgb(255 255 255 / .07));
}
input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--control); }
input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border: 1px solid rgb(0 0 0 / .55); border-radius: 50%; background: var(--control);
}
/* a YIELDED slider (sky time under real-clock, basic-only knobs under the
   detailed sky) keeps the house hue, dimmed — the UA's disabled range
   painted stark white against every teal sibling */
input[type=range]:disabled { accent-color: color-mix(in srgb, var(--control) 40%, #555); opacity: .5; }
/* Checkboxes take the same accent as the sliders — seafoam fill, UA-contrast
   (black) tick when checked. This existed via accent-color when the audio
   panel first spent the house palette, and fell out of the selector when the
   checkbox rows moved to .row.wide markup. */
.row input[type=checkbox] {
  /* custom box: accent-color only paints the CHECKED state in
     Chromium — unchecked fell back to UA white. */
  appearance: none; -webkit-appearance: none;
  width: 15px; height: 15px; margin: 0; border-radius: 4px;
  background: var(--well);
  border: 1px solid color-mix(in srgb, var(--brand) 45%, transparent);
  display: inline-grid; place-items: center; cursor: pointer;
}
.row input[type=checkbox]:hover { border-color: color-mix(in srgb, var(--brand) 75%, transparent); }
.row input[type=checkbox]:checked { background: var(--brand); border-color: var(--brand); }
.row input[type=checkbox]:checked::before {
  content: ''; width: 8px; height: 5px; margin-top: -2px;
  border-left: 2px solid var(--ink-on-brand); border-bottom: 2px solid var(--ink-on-brand);
  transform: rotate(-45deg);
}
.row .v { min-width: 34px; flex: none; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }

/* 🔴 .row.wide — the SAME row, for panels whose labels are sentences.
   (Reuse the existing class: the audio panel once carried 40 lines of
   private CSS re-implementing .row under sp-* names, which is how its spacing
   drifted to gap:10px while the house row is 7px and nobody could see it
   without measuring.)
   .row's 42px .nm cannot hold "connect to other people's audio", so this
   variant swaps flex for a two-column grid with a label column wide enough for
   a sentence — and inherits gap, font-size and colour from .row itself, so it
   CANNOT drift again. Everything else (range accent, .v readout, .nm colour)
   already comes from the rules above and needs no duplicate. */
/* 🔴 THE ROW RULE (live, 09-04: "stop making people guess"). Labels are LEFT-aligned
   everywhere in a FIXED, not-very-wide column (7rem) and WRAP if they must; the
   control sits right beside the label (start of its cell), never pushed to the
   far edge of a wide frame. .row = short label (42px) + slider + readout;
   .row.wide = label + one control; .btn-row = buttons, each capped at 12rem.
   No private layout rules anywhere. */
/* R 10-11 supersedes the left-aligned rule: labels RIGHT-justified, controls left-justified, both against ONE invisible
   line, as the edit-mode panels do ("the Settings panel aren't aligned like stuff in the Edit mode menus") */
.row.wide { display: grid; grid-template-columns: var(--row-label-col, clamp(6rem, 36%, 10rem)) minmax(0, 1fr); align-items: center; column-gap: 9px; }
.row.wide > .nm { width: auto; max-width: none; overflow: visible; text-align: right; line-height: 1.25; white-space: normal; overflow-wrap: anywhere; }
/* selects stay compact and start-aligned; the CONTROL CELL stretches so a slider
   or meter inside fills the row (Audio's did not — .ctl had been swept into the
   12rem cap by a bad edit;) */
.row.wide > select, .row.wide .ctl > select { max-width: 12rem; justify-self: start; }
.row.wide > .ctl { justify-self: stretch; display: flex; align-items: center; gap: 6px; min-width: 0; }
/* a label + a bare control still lines up: the control owns the whole second
   column, left-justified against the centre line */
.row.wide > input[type=checkbox] { justify-self: start; }
/* the control column, when a row needs several things side by side */
.row .ctl { display: flex; align-items: center; gap: 6px; min-width: 0; }
/* a status word riding beside a control — dim, because it reports rather than
   labels. (.sp-note did this in the audio panel's private sheet; it is a house
   concern, not that panel's.) */
.row .note { color: var(--dim); }

/* who's-here list */
/* .who-row is a <button> (chat.js): _contentClaims exempts only BUTTON/INPUT/
   TEXTAREA/SELECT/A from the frame's drag surface, so a <div> row was swallowed
   by the frame's pointerdown and its dblclick never fired. These resets keep it
   looking exactly like the row it was. (R, 2026-09-11) */
.who-row {
  display: flex; justify-content: space-between; gap: 12px; padding: 2px 0;
  width: 100%; text-align: left; background: none; border: none; border-radius: 4px;
  font: inherit; color: inherit; cursor: pointer;
}
.who-row:hover { background: var(--hov); }
.who-row.self { cursor: default; }
.who-row.self:hover { background: none; }
.who-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who-row .d { color: var(--dim); flex: none; }
.who-row.self .n { color: var(--fg); }
/* a pending ask (consentinbox.js): this person asked to touch / pose / move me and waits up to 20 s for an answer */
.who-row .who-ask { flex: none; margin-left: 4px; width: 16px; height: 16px; line-height: 16px; border-radius: 999px; text-align: center;
  font-size: 11px; font-weight: 700; color: #000; background: var(--attn, #e8b84a); animation: who-ask-pulse 1.2s ease-in-out infinite; }
@keyframes who-ask-pulse { 50% { opacity: .45; } }

/* --------------------------------------------------------------- fixed hud */
/* the ∃ mark — anchor of the whole chrome. Carries connection truth: full
   when live, dimmed + pulsing when the socket is down. (status without
   a status bar.) The mic/ear glyphs auto-ride its right edge. */
#hud.emark {
  /* lives INSIDE the rail now — one movable unit. Mic/ear ride its box. */
  position: relative;
  display: grid; place-items: center;
  color: var(--brand); border: none; cursor: pointer; background: none; box-shadow: none;
}
#dock #hud.emark { color: var(--dim); }                             /* local only */
#dock #hud.emark.net-live { color: var(--brand); }   /* connected — the accent itself, same as an open panel's icon and the live mic/ear (ONE ink; live: line-weight off-icons solved readability, so on can be pure brand) */
#dock #hud.emark:hover, #dock #hud.emark.net-live:hover { color: var(--fg); }   /* hover = white, like the rail's buttons (live, 09-04) */
#dock #hud.emark.net-wait { color: var(--dim); animation: netpulse 2.6s ease-in-out infinite; }  /* trying */
/* arranging (menu-edit) mode: hovering the E or a button still goes white —
   the affordance must survive the mode (live, 09-04) */
body.arranging #dock #hud.emark:hover, body.arranging #dock button:not(.dock-grip):hover { color: var(--fg) !important; }
body.arranging #dock #hud.emark {
  color: var(--ink-on-brand); background: var(--brand-deep); border-radius: 8px; animation: none;  /* inverted: you're holding the chrome */
}
/* (the editing dot on the ∃ retired 09-13 — the wrench says it) */
@keyframes netpulse { 50% { opacity: .35; } }
/* presence on the profile icon: a dot in the bottom-right corner (the
   Discord/Slack convention) — brand = present, attention = away, err = busy */
#dock button[data-toggles="profile"] { position: relative; }
/* a frame's badge (chat unread) rides its dock button at rest — the title bar is hidden until arranging */
#dock button { position: relative; }
#dock .dk-badge { position: absolute; top: 1px; right: 1px; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px; background: var(--brand); color: var(--bg); font-size: 9px; line-height: 14px; text-align: center; pointer-events: none; }
#dock .dk-badge b { font-weight: 600; } #dock .dk-badge b.ping { text-decoration: underline; }
#dock button[data-toggles="profile"]::after {
  content: ''; position: absolute; right: 4px; bottom: 4px; width: 8px; height: 8px; border-radius: 50%;
  background: #3ddc84; box-shadow: 0 0 0 2px rgb(var(--panel-rgb));   /* FIXED green (live 09-05 16:47 + 21:38: presence is never the accent) */
}
#dock button[data-toggles="profile"][data-presence="away"]::after { background: #f5b83d; border-radius: 2px; transform: rotate(45deg) scale(.85); }   /* fixed colours + shapes, as on the profile (live, 09-05) */
#dock button[data-toggles="profile"][data-presence="busy"]::after { background: linear-gradient(rgb(var(--panel-rgb)), rgb(var(--panel-rgb))) center / 60% 20% no-repeat, #ef5b5b; border-radius: 2px; }   /* square-with-bar, like the profile's (the pseudo IS the dot, so the bar is a gradient) */
/* profile (09-05 redesign): portrait = presence control; top tabs; one pane */
.pf-portrait { position: relative; width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; padding: 0;
  background: color-mix(in srgb, var(--who) 55%, rgb(var(--panel-rgb))); color: var(--fg); border: 1px solid transparent; cursor: pointer; }
.pf-portrait:hover, .pf-portrait[aria-expanded="true"] { border-color: var(--brand); }
.pf-portrait svg { opacity: .85; }
/* presence marks are FIXED colours and distinct SHAPES, never the accent (live,
   09-05 16:47: standard green/amber/red, shapes for colourblind readers):
   present = green circle · away = amber diamond · busy = red square-with-bar */
.pf-portrait-dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgb(var(--panel-rgb)); background: #3ddc84; }
.pf-pop-dot { width: 10px; height: 10px; border-radius: 50%; background: #3ddc84; flex: none; }
[data-presence="away"] > .pf-portrait-dot, .pf-pop-dot[data-presence="away"] { background: #f5b83d; border-radius: 2px; transform: rotate(45deg) scale(.85); }
[data-presence="busy"] > .pf-portrait-dot, .pf-pop-dot[data-presence="busy"] { background: #ef5b5b; border-radius: 2px; }
[data-presence="busy"] > .pf-portrait-dot::after, .pf-pop-dot[data-presence="busy"]::after { content: ''; position: absolute; left: 20%; right: 20%; top: 40%; bottom: 40%; background: rgb(var(--panel-rgb)); border-radius: 1px; }
.pf-pop-dot { position: relative; }
/* the Who panel's mark: the same fixed colours + shapes as the profile */
.who-mark { position: relative; display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #3ddc84; margin-right: 7px; flex: none; align-self: center; }   /* align-self, NOT vertical-align: the row is a flex container and vertical-align is inert there — measured 4.5px of lift, which is what the owner saw (2026-09-11: "they're a bit offset above in kind of an odd way") */
.who-mark[data-presence="away"] { background: #f5b83d; border-radius: 2px; transform: rotate(45deg) scale(.85); }
.who-mark[data-presence="busy"] { background: #ef5b5b; border-radius: 2px; }
.who-mark[data-presence="busy"]::after { content: ''; position: absolute; left: 20%; right: 20%; top: 40%; bottom: 40%; background: rgb(var(--panel-rgb)); border-radius: 1px; }
.pf-who .pf-state { font-style: normal; color: var(--brand); }
.pf-id { position: relative; }
.pf-pop { position: absolute; left: 0; top: 46px; z-index: 5; display: flex; flex-direction: column; gap: 2px; padding: 5px; min-width: 240px;
  background: rgb(var(--panel-rgb) / .97); border: 1px solid var(--edge); border-radius: 8px; box-shadow: var(--shadow); }
.pf-pop-row { display: flex; align-items: center; gap: 10px; text-align: left; padding: 6px 10px; border: none; border-radius: 6px; background: none; color: var(--fg); font-size: var(--fs-sm); cursor: pointer; }
.pf-pop-row:hover { background: rgb(255 255 255 / .06); }
.pf-pop-row.on { background: var(--well); color: var(--brand); font-weight: 600; }
.pf-tabs { display: flex; gap: 2px; margin: 10px 0 8px; border-bottom: 1px solid var(--edge); overflow-x: auto; scrollbar-width: none; }   /* past icons-only (windows.js fitTabStrip) the strip scrolls rather than clip */
.pf-tab { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 7px; border: none; border-bottom: 1px solid transparent; background: none; color: var(--dim); font-size: var(--fs-sm); cursor: pointer; border-radius: 6px 6px 0 0; }   /* INSIDE the box, same as the chat strip: one tab mechanism, not two (R, 2026-09-11: "Should we consolidate style here") */
.pf-tab svg { opacity: .8; color: var(--icon); }          /* the section-head recipe: desaturated brand at .8 when idle (live, 09-05) */
/* THE PROFILE TABS NEVER OPTED OUT OF THE GLOBAL BUTTON CHAIN, and it showed:
   measured with a real mouse hover, `.pf-tab:hover` painted NOTHING while
   `.pf-tab.on` inherited `button.on { background: var(--hov) }` = 6% white. So
   the selected tab was the brightest thing in the strip and hovering its
   neighbour changed only the text — which reads exactly as R described it
   (2026-09-11): "they actually get *darker* when highlighted, which is really
   strange!" Both states are now stated here, matching the chat strip: hover is
   the livelier one, selection is the calm one. */
.pf-tabs .pf-tab:hover { color: var(--fg); background: rgb(143 232 200 / .13); }
.pf-tabs .pf-tab.on { color: var(--brand); border-bottom-color: var(--brand); background: var(--well); }
.pf-tabs .pf-tab.on:hover { background: color-mix(in srgb, rgb(143 232 200 / .13) 45%, var(--well)); }
.chat-tabs button.on:hover { background: color-mix(in srgb, rgb(143 232 200 / .13) 45%, var(--well)); }   /* the active tab BLENDS its hover with --well, same as .pf-tab.on:hover — without this the plain :hover replaced the pressed-in fill and the two strips diverged on hover alone */
.pf-tab.on svg { opacity: 1; color: var(--brand); }
.pf-pane { flex: 1; min-height: 0; overflow: auto; }
.pf-stub { color: var(--dim); font-size: var(--fs-sm); padding: 10px 2px; line-height: 1.5; }   /* empty BY DESIGN, and says so — the .who-empty idiom (R, 2026-09-11) */
/* the ∃ menu — a File-style dropdown hanging from the ∃ (ui.js anchorBeside), and its one flyout (Panels ▸ / About ▸).
   z 50: OVER the mic/ear/visor glyphs and the status chips (45) it opens across; under notices (60) and the door. */
#emenu, #emenu-sub {
  position: fixed; top: 54px; left: 10px; z-index: 50;
  display: flex; flex-direction: column; min-width: 184px; padding: 6px;
}
#emenu-sub { min-width: 196px; max-height: calc(100vh - 8px); overflow-y: auto; }
#emenu[hidden], #emenu-sub[hidden], #layoutbar[hidden] { display: none; }
#emenu .mrow, #emenu-sub .mrow, #emenu .mpin, #emenu-sub .mpin { cursor: pointer; }
#emenu .mrow.dead, #emenu-sub .mrow.dead { opacity: .42; cursor: not-allowed; }   /* listed, not offered */
#emenu .mrow.dead.soft { cursor: help; }   /* …and a press says why (ui.js topRow) */
#emenu-sub .mrow.dead .mpin { pointer-events: none; }
#emenu .mrow, #emenu-sub .mrow {
  display: flex; align-items: center; gap: 9px; padding: 7px 9px; min-height: 32px; box-sizing: border-box;
  background: none; border: none; border-radius: 6px; color: var(--dim);
  font-size: var(--fs-sm); text-align: left;
}
#emenu .mrow:hover, #emenu-sub .mrow:hover, #emenu .mrow.subopen { background: var(--hov); color: var(--fg); }
#emenu .mrow.dead:hover { color: var(--dim); }
#emenu .mrow > svg:first-child, #emenu-sub .mrow > svg:first-child { flex: none; opacity: .8; color: var(--icon); }
#emenu .mrow .mname, #emenu-sub .mrow .mname { flex: 1; white-space: nowrap; }
#emenu .mdetail { font-style: normal; color: var(--dim); opacity: .8; margin-left: 4px; }
#emenu .mcaret { display: flex; opacity: .6; margin-right: -2px; }
#emenu .mrow.subopen .mcaret { opacity: 1; color: var(--brand); }
#emenu .mkey { font-size: var(--fs-xs); min-width: 18px; text-align: center; }
#emenu .mtag { font-size: var(--fs-xs); color: var(--dim); }
#emenu-sub .mrow.open { color: color-mix(in srgb, var(--brand) 35%, var(--fg)); }
#emenu-sub .mrow.open svg:first-child { opacity: 1; }
#emenu-sub .mrow[data-layout].open { background: color-mix(in srgb, var(--brand) 14%, transparent); }
/* the pin is the whole right end of its row, not a 22px dot: a near miss used to land on the row and toggle the
   window instead of pinning it */
#emenu-sub .mpin {
  flex: none; display: grid; place-items: center; width: 34px; height: 32px; margin: -7px -9px -7px 0; padding: 0; line-height: 0;
  background: none; border: none; border-radius: 0 6px 6px 0; color: var(--dim); opacity: .35;
}
#emenu-sub .mpin:hover { opacity: 1; background: var(--hov); }
#emenu-sub .mpin.on { opacity: 1; color: var(--brand); }
#emenu .msep, #emenu-sub .msep { height: 1px; background: var(--edge); margin: 5px 4px; }
#emenu-sub .minfo { padding: 5px 9px; font-size: var(--fs-sm); color: var(--fg); white-space: nowrap; }
#emenu-sub .minfo.dim { color: var(--dim); }
/* HUD layout mode's marker, beside the ∃ where the menu opens (the menu covers it while open) */
#layoutbar {
  position: fixed; z-index: 46; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 10px;
  font-size: var(--fs-sm); color: var(--fg); white-space: nowrap;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--brand) 45%, transparent);
}
#layoutbar > svg { color: var(--brand); flex: none; }
#layoutbar kbd { font-size: var(--fs-xs); }
#layoutbar .lb-done { height: 24px; padding: 0 10px; border-radius: 6px; }
/* headers exist only while arranging (the ∃ menu is open) — and they FLOAT
   above the frame (below, when the frame hugs the top edge) so opening the
   menu never shifts a single window's geometry. */
.frame .fr-head { display: none; }
body.arranging .frame { overflow: visible; }
/* the dashed arrange border rides the ::after overlay (z-30): it paints OVER
   the seated header chips — which used to darken the segment beneath them —
   and follows the corner radius, which outline never did */
body.arranging .frame::after { border: 1px dashed rgb(255 255 255 / .25); }
body.arranging .frame > .fr-body { overflow: hidden; }
/* the arrange chrome reads as TABS: name docked to the frame's top-left,
   close/collapse docked top-right — corners, where hands expect them */
body.arranging .frame .fr-head {
  /* tabs start AFTER the corner radius (browser-tab convention): the curve
     stays pristine, the rim-light unbroken, and no corner needs filling.
     The simple one wins. */
  display: flex; position: absolute; bottom: 100%; left: calc(var(--r) + 2px); right: calc(var(--r) + 2px);
  justify-content: space-between; align-items: flex-end;
  padding: 0; background: none; border: none; pointer-events: none;
}
body.arranging .frame .fr-head .fr-title,
body.arranging .frame .fr-head .fr-btns {
  pointer-events: auto;
  background: var(--chip); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: 7px 7px 0 0; padding: 3px 10px;
  margin-bottom: -1px;   /* seat onto the rim-light so the tab reads attached */
}
body.arranging .frame .fr-head .fr-title { flex: 0 1 auto; cursor: grab; }
body.arranging .frame .fr-head .fr-btns { padding: 3px 5px; }
body.arranging .frame.label-below .fr-head { bottom: auto; top: 100%; align-items: flex-start; }
body.arranging .frame.label-below .fr-head .fr-title,
body.arranging .frame.label-below .fr-head .fr-btns {
  border-radius: 0 0 7px 7px;
  margin-bottom: 0; margin-top: -1px;
}
/* sticky-edge glow: this frame is riding that edge and will follow it.
   Composed from one custom property per edge so a CORNER frame shows BOTH
   glows (the old per-class box-shadow rules overwrote each other — a frame
   stuck to two sides only ever lit the last one). */
body.arranging .frame {
  --sg: color-mix(in srgb, var(--brand) 60%, transparent);
  --nosh: 0 0 rgb(0 0 0 / 0);
  box-shadow: var(--st-l-s, var(--nosh)), var(--st-r-s, var(--nosh)),
              var(--st-t-s, var(--nosh)), var(--st-b-s, var(--nosh)),
              0 1px 5px rgb(0 0 0 / .28);
}
body.arranging .frame.st-l { --st-l-s: inset 2px 0 0 var(--sg); }
body.arranging .frame.st-r { --st-r-s: inset -2px 0 0 var(--sg); }
body.arranging .frame.st-t { --st-t-s: inset 0 2px 0 var(--sg); }
body.arranging .frame.st-b { --st-b-s: inset 0 -2px 0 var(--sg); }
/* Edit mode has to be legible without reading the HUD: the cursor changes and
   the viewport gets a thin warm frame, so it is obvious why a drag just moved
   a crate instead of the camera. */
body.edit-mode canvas { cursor: crosshair; }
/* (the warm rim around the whole frame retired 09-13: the wrench wears the accent) */

#trayzone {
  position: fixed; right: 10px; bottom: 10px; z-index: 28;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  max-width: min(400px, 46vw); pointer-events: none;
}
#loading { padding: 7px 10px; font-size: var(--fs-sm); color: var(--warn); white-space: pre; display: none; }
#loading.on { display: block; }
#toasts { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; z-index: 60; }   /* same tier as #hintbar: temporary, possibly urgent, outranks the chrome */
/* floating chrome carries a thin outline so it separates from whatever the
   world is drawing behind it (live, 09-04): toasts, hint bar, chat gear pop, hud pops */
.toast, #hintbar, .chat-gearpop, .hud-pop, #tipchip {
  outline: 1px solid var(--edge-hi); outline-offset: -1px;
  /* and fully OPAQUE — readable over anything the world draws (live, 09-04) */
  background: rgb(var(--panel-rgb)); backdrop-filter: none; -webkit-backdrop-filter: none;
}
.toast {
  padding: 7px 10px; font-size: var(--fs-sm); max-width: 100%;
  border-left: 3px solid var(--dim); white-space: pre-wrap; word-break: break-word;
  animation: toastin .18s ease-out; pointer-events: auto;
}
.toast.err  { border-left-color: var(--err); color: var(--err); }
.toast.warn { border-left-color: var(--warn); color: var(--warn); }
.toast.info { border-left-color: var(--accent); color: var(--fg); }
.toast .ctx { color: var(--dim); }
.toast.out { opacity: 0; transition: opacity .3s, transform .3s; transform: translateX(12px); }
@keyframes toastin { from { opacity: 0; transform: translateX(12px); } }

#hintbar {
  /* OVER the chrome, not under it. Hints are temporary and may carry urgent
     information, so they outrank the rail (27/28), the frame rim (30) and the ∃
     menu (40) — the same reasoning .toast follows. R, 2026-09-11: "those should
     probably paint OVER the HUD because they're temporary and may contain
     urgent info". Kept below .dd-pop (200) so an open dropdown still wins. */
  position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
  z-index: 60; padding: 5px 12px; font-size: var(--fs-sm); color: var(--dim);
  pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden;
  text-overflow: ellipsis; transition: opacity .5s;
}
#hintbar kbd { font-size: var(--fs-xs); }
#hintbar.gone { opacity: 0; }
#hintbar.attn { color: var(--attn); border-color: var(--attn); }   /* asked for, didn't happen: the reason (ui.js flashHint tone) */

/* ---- the lantern (lib/commandbar.js): one line for talk, /commands and actions.
   Ported from the HUD redesign mockups (the lantern direction, desktop and open).
   ONE element owns bottom-centre: the resting line. The hint bar borrows that same
   spot while it has something to say ("X — sit", a flash) and the line steps aside;
   the open panel replaces it. --ln-x (commandbar.js place()) is the shared axis: the
   viewport centre, or the free span beside the chat compose box when centre would
   sit on it.
   z 38: over frames (≤25), the rail (27) and the frame rim (30); under the ∃
   menu and the scrims (40), the glyphs (45), notices (60) and the door (120). */
#hintbar { bottom: var(--ln-b, 24px); left: var(--ln-x, 50%); height: 36px; box-sizing: border-box;
  display: block; line-height: 34px; padding: 0 14px; border-radius: 999px; font-size: 13px; }
/* block, not flex (R 10-11: "the text is right up against the 'T' in the box on either side"): a flex box makes every text
   run its own item and drops the spaces at their ends, so 'click or ' + <kbd>T</kbd> + ' to pick up' lost both spaces */
#hintbar kbd { vertical-align: middle; position: relative; top: -1px; }
/* an attn bar wraps instead of cutting a long reason with an ellipsis (the bar is otherwise one 36 px line), so the copy pill at its end always shows */
#hintbar.attn { pointer-events: auto; user-select: text; white-space: normal; height: auto; min-height: 36px; line-height: 20px; padding: 7px 14px; text-overflow: clip; }
/* a small pill after the words, not a 34 px block in front of them (R 10-11 22:48: "fix the size… move it to the end") */
#hintbar .hint-copy { margin-left: 8px; padding: 0 5px; height: 18px; line-height: 16px; border-radius: 999px; border: 1px solid currentColor; background: none; color: inherit; font: inherit; font-size: 11px; cursor: pointer; opacity: .8; vertical-align: middle; }
#hintbar .hint-copy:hover { opacity: 1; }
/* a claim that is a NODE (edit mode's selection line, with its lock checkbox): a row, clickable */
#hintbar.has-node { pointer-events: auto; display: flex; gap: 14px; align-items: center; height: auto; min-height: 36px; padding: 7px 13px; white-space: normal; }
#hintbar .edit-selbar { display: flex; gap: 14px; align-items: center; }
/* the lantern pill is the bar's resting content: it yields while any claim shows (ui.js showStatus) */
#lantern-pill.yield { opacity: 0; pointer-events: none; transition: opacity .2s; }
#hintbar:empty { display: none; }
#hintbar:not(.gone):not(:empty) ~ #lantern-pill { visibility: hidden; }
body.lantern-open #hintbar { visibility: hidden; }   /* the open panel's footer sits in this band (both bottom 24px); on a phone its list can reach it */
/* toasts and the loading tray stack from above the resting line's band, not into it
   (the line can sit in the free span right of the chat frame — the tray's corner) */
@media (min-width: 601px) { #trayzone { bottom: 72px; } }
#lantern-pill {
  position: fixed; bottom: var(--ln-b, 24px); left: var(--ln-x, 50%); transform: translateX(-50%); z-index: 38;
  display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 12px; border-radius: 999px;
  font: 400 13px/1 var(--font); color: var(--dim); cursor: text; white-space: nowrap;
  border: none; outline: none;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .07), 0 0 0 1px rgb(255 255 255 / .055), 0 2px 6px rgb(0 0 0 / .28);
}
#lantern-pill:hover { color: var(--fg); }
#lantern-pill.open { visibility: hidden; }
/* HUD layout mode (owner, 10-01): the resting line is one more thing to arrange — dashed like the frames, grabbable
   (commandbar.js drags it, --ln-x/--ln-b); it shows even while the hint bar would borrow its spot */
body.arranging:not(.ui-locked) #lantern-pill { cursor: grab; outline: 1px dashed rgb(255 255 255 / .3); outline-offset: 3px; }
body.arranging:not(.ui-locked) #lantern-pill:active { cursor: grabbing; }
body.arranging #hintbar { visibility: hidden; }
