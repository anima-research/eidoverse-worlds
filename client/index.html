<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eidoverse-worlds</title>
<style>
/* ===========================================================================
   Design tokens. One place to change the client's whole look.
   =========================================================================== */
:root {
  --bg:        #0a1018;
  --panel:     rgba(9, 20, 28, 0.84);
  --edge:      rgba(120, 190, 170, 0.22);
  --edge-hi:   rgba(143, 232, 200, 0.55);
  --fg:        #e6f0ec;
  --dim:       #8ba39c;
  --accent:    #8fe8c8;
  --accent-dk: #1d3a34;
  --warn:      #e8c96a;
  --err:       #ff8f8f;
  --ping:      #ffd479;

  --r:         7px;
  --shadow:    0 6px 22px rgba(0, 0, 0, 0.45);
  --font:      ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --fs:        13px;
  --fs-sm:     11.5px;
  --speed:     .16s;
}
@media (prefers-reduced-motion: reduce) {
  :root { --speed: 0s; }
  * { animation: none !important; }
}

html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
body { font: var(--fs)/1.5 var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; }
canvas { display: block; touch-action: none; }

.panel {
  background: var(--panel);
  border: 1px solid var(--edge);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
}

button, .btn {
  font: var(--fs-sm)/1.4 var(--font);
  color: var(--fg);
  background: rgba(20, 40, 46, 0.7);
  border: 1px solid var(--edge);
  border-radius: 5px;
  padding: 6px 9px;
  cursor: pointer;
  text-align: left;
  transition: background var(--speed), border-color var(--speed);
}
button:hover, .btn:hover { background: rgba(32, 68, 62, 0.9); border-color: var(--edge-hi); }
button:active { transform: translateY(1px); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.on { background: var(--accent-dk); border-color: var(--edge-hi); color: var(--accent); }
/* unshared local changes are pending until committed */
button.dirty { border-color: var(--warn); color: var(--warn); }

input[type=text], input[type=search], input:not([type]) {
  font: var(--fs-sm) var(--font);
  color: var(--fg);
  background: rgba(4, 14, 20, 0.9);
  border: 1px solid var(--edge);
  border-radius: 5px;
  padding: 6px 8px;
}
input::placeholder { color: var(--dim); }
select {
  font: 11px var(--font); background: rgba(4,14,20,.9); color: var(--fg);
  border: 1px solid var(--edge); border-radius: 5px; padding: 5px;
}


/* ============================================================ splash
   Deliberately plain CSS on static markup: this has to paint the instant the
   HTML lands, BEFORE the 2.1MB engine module is even requested. Anything that
   waits for JavaScript here is showing a black page during the slowest part
   of the boot, which is exactly the problem. */
#splash {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; padding: 28px; box-sizing: border-box;
  background:
    radial-gradient(1100px 620px at 50% 34%, #16303a 0%, #0c1720 46%, var(--bg) 100%);
  transition: opacity .6s ease, visibility .6s;
  font: var(--fs)/1.6 var(--font); color: var(--fg);
}
#splash.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.sp-mark {
  font-size: 26px; letter-spacing: .18em; color: var(--accent);
  text-transform: lowercase; font-weight: 600;
}
.sp-sub { color: var(--dim); font-size: var(--fs-sm); margin-top: -14px; text-align: center; }
.sp-sub b { color: var(--fg); font-weight: 600; }
.sp-bar {
  width: min(430px, 84vw); height: 3px; border-radius: 2px;
  background: rgba(255,255,255,.09); overflow: hidden;
}
.sp-bar-fill {
  width: 0%; height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, #4fb79a, var(--accent));
  transition: width .45s cubic-bezier(.22,.9,.3,1);
}
.sp-status {
  display: flex; justify-content: space-between; gap: 16px;
  width: min(430px, 84vw); font-size: var(--fs-sm); margin-top: -14px;
}
.sp-phase { color: var(--accent); }
.sp-phase::after { content: '…'; }
.sp-detail { color: var(--dim); font-variant-numeric: tabular-nums; }
.sp-tip {
  display: flex; align-items: flex-start; gap: 11px;
  max-width: min(500px, 88vw); font-size: var(--fs-sm); color: var(--dim);
  min-height: 44px; text-align: left;
}
.sp-tip b { color: var(--fg); font-weight: 600; }
.sp-tip .tipk {
  flex: none; width: 26px; height: 26px; border-radius: 6px;
  display: grid; place-items: center; color: var(--accent);
  background: rgba(143,232,200,.1); border: 1px solid var(--edge);
}
.sp-skip {
  opacity: 0; pointer-events: none; transition: opacity .4s;
  font-size: var(--fs-sm); color: var(--dim); background: none; border: none;
}
.sp-skip.show { opacity: 1; pointer-events: auto; }
.sp-skip:hover { color: var(--fg); background: none; }
@media (prefers-reduced-motion: reduce) { .sp-bar-fill { transition: none; } }

/* =========================================================== frames (windows)
   Movable, resizable, collapsible, layout remembered. The scene is the
   content, so the chrome has to get out of the way on the user's terms. */
.frame {
  position: fixed; display: flex; flex-direction: column;
  z-index: 20; min-width: 170px; overflow: hidden;
}
.fr-head {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 6px 5px 10px; cursor: grab;
  border-bottom: 1px solid var(--edge);
  background: rgba(12, 28, 34, 0.6); flex: none;
  user-select: none; -webkit-user-select: none;
}
.fr-head:active { cursor: grabbing; }
.ui-locked .fr-head { cursor: default; }
.fr-title {
  flex: 1; font-size: var(--fs-sm); color: var(--dim);
  text-transform: uppercase; letter-spacing: .085em; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fr-badge {
  font-size: 10px; color: var(--dim); background: rgba(0,0,0,.3);
  border-radius: 9px; padding: 0 6px; flex: none;
}
.fr-badge b { color: var(--fg); font-weight: 600; }
.fr-badge b.ping { color: var(--ping); }
.fr-btns { display: flex; gap: 2px; flex: none; }
.fr-btn {
  padding: 1px 6px; font-size: 11px; line-height: 1.4;
  background: none; border: none; color: var(--dim);
}
.fr-btn:hover { background: rgba(255,255,255,.07); color: var(--fg); }
.ui-locked .fr-btn { display: none; }
.fr-body { display: flex; flex-direction: column; overflow: hidden; min-height: 0; }
.frame.collapsed .fr-body { display: none; }
.frame.collapsed { height: auto !important; }
/* scrollbars sit a couple px in from the frame edge so the scroll thumb and
   the edge-resize band don't fight over the same column */
.frame .fr-body { padding-right: 3px; }
.frame.flash { animation: flash 1.4s ease-out; }
@keyframes flash {
  0%, 100% { border-color: var(--edge); }
  15%, 55% { border-color: var(--ping); box-shadow: 0 0 0 1px var(--ping), var(--shadow); }
}

/* ------------------------------------------------------------------- chat */
.chat-frame .fr-body { padding: 0; }
.chat-tabs { display: flex; gap: 2px; padding: 5px 6px 0; flex: none; }
.chat-tabs button {
  flex: 1; text-align: center; padding: 3px 4px; font-size: 10.5px;
  background: none; border: none; border-bottom: 2px solid transparent; color: var(--dim);
  border-radius: 0;
}
.chat-tabs button.on { color: var(--accent); border-bottom-color: var(--accent); background: none; }

.chat-log {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 6px 10px; display: flex; flex-direction: column;
  scrollbar-width: thin; scrollbar-color: var(--edge) transparent;
  user-select: text; -webkit-user-select: text;
}
.chat-log::-webkit-scrollbar { width: 7px; }
.chat-log::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 4px; }
.chat-log .line { padding: 1px 0; word-wrap: break-word; overflow-wrap: anywhere; }
.chat-log .line.filtered { display: none; }
.chat-log .line .t { color: var(--dim); font-size: 10px; margin-right: 6px; opacity: .6; }
.chat-log .line .who { color: var(--accent); font-weight: 600; }
.chat-log .line .who::after { content: ':'; color: var(--dim); font-weight: 400; }
.chat-log .line .body { margin-left: 5px; }
/* Your own name now takes its participant colour like everyone else's (it must
   look the same to you as it does to them), so "this one is mine" is carried by
   a faint wash instead. .ping's background is declared later and still wins. */
.chat-log .line.me { background: rgba(255,255,255,.04); border-radius: 3px; }
.chat-log .line.agent .who::before { content: '◈ '; color: var(--warn); font-size: 10px; }
.chat-log .line.sys { color: var(--dim); font-style: italic; }
.chat-log .line.hist-note {
  border-bottom: 1px dashed var(--edge); padding-bottom: 4px; margin-bottom: 4px;
  font-style: normal; opacity: .8;
}
.chat-log .line.sys .who { display: none; }
.chat-log .line.sys .body { margin-left: 0; }
/* grouped continuation lines: hide the repeated name, keep the text aligned */
.chat-log .line.cont .t { visibility: hidden; font-size: 10px; }
.chat-log .line.cont .who { display: none; }
.chat-log .line.ping {
  background: rgba(255, 212, 121, .09);
  border-left: 2px solid var(--ping); margin-left: -10px; padding-left: 8px;
}
.chat-log .mention { color: var(--accent); background: rgba(143,232,200,.12); border-radius: 3px; padding: 0 2px; }
.chat-log .mention.me { color: var(--ping); background: rgba(255,212,121,.18); font-weight: 600; }
.chat-log .lnk { color: var(--accent); }

.chat-jump {
  display: none; position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%);
  z-index: 3; font-size: 10.5px; padding: 3px 10px; border-radius: 11px;
  background: var(--accent-dk); border-color: var(--edge-hi); color: var(--accent);
}
.chat-jump.ping { background: #4a3a18; border-color: var(--ping); color: var(--ping); }

.chat-compose { position: relative; padding: 6px; flex: none; }
.chat-compose input { width: 100%; box-sizing: border-box; font-size: var(--fs); }

.ac {
  position: absolute; left: 6px; right: 6px; bottom: calc(100% - 4px);
  max-height: 168px; overflow-y: auto; z-index: 5; padding: 3px;
  scrollbar-width: thin;
}
.ac-row {
  display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
  padding: 4px 7px; border-radius: 4px; cursor: pointer; font-size: var(--fs-sm);
}
.ac-row.on { background: var(--accent-dk); }
.ac-row .ac-l { color: var(--fg); white-space: nowrap; }
.ac-row.on .ac-l { color: var(--accent); }
.ac-row .ac-h { color: var(--dim); font-size: 10px; text-align: right; overflow: hidden; }

.chat-log .line.whisper { background: rgba(160, 140, 220, .10); border-left: 2px solid #a08cdc;
  margin-left: -10px; padding-left: 8px; }
.chat-log .line.whisper .who { color: #c4b5f0; }
.chat-log .line.whisper .who::before { content: '⤷ '; }
.chat-log .line.whisper.me .who::before { content: '⤶ '; }
.chat-tabs button.has-unread { color: var(--ping); }
.chat-typing {
  display: none; padding: 0 10px 3px; font-size: 10.5px; color: var(--dim);
  font-style: italic; flex: none;
}

/* ------------------------------------------------------------ panel frames */
.sec { display: flex; flex-direction: column; gap: 5px; }
.sec > .head { font-weight: 600; }
.sec > .body {
  display: none; flex-direction: column; gap: 4px;
  padding: 6px; max-height: 44vh; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: var(--edge) transparent;
  border: 1px solid var(--edge); border-radius: 5px;
}
.sec.open > .body { display: flex; }
.stack { padding: 7px; gap: 6px; display: flex; flex-direction: column; overflow-y: auto; flex: 1; min-height: 0; }
.stack::-webkit-scrollbar, .sec > .body::-webkit-scrollbar { width: 6px; }
.stack::-webkit-scrollbar-thumb, .sec > .body::-webkit-scrollbar-thumb { background: var(--edge); border-radius: 3px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
/* The body picker holds ~18 faces. Two columns made each card ~250px, so
   choosing meant scrolling past a wall of portraits. */
.grid.dense { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.grid.dense .card span { font-size: 9.5px; }
.card .ph {
  width: 100%; aspect-ratio: 1; border-radius: 4px;
  background: rgba(0,0,0,.3); display: none;
  place-items: center; font-size: 26px; opacity: .35;
}
.card {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 4px; font-size: 10px; line-height: 1.25; text-align: center;
  word-break: break-word; position: relative;
}
.card canvas, .card img {
  width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px;
  background: rgba(0,0,0,.35);
}
/* library filenames are SEO soup — clamp so a card stays a card */
.card span {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; width: 100%;
}
.card:hover span { -webkit-line-clamp: 4; }
.card.on { background: var(--accent-dk); border-color: var(--edge-hi); }

.row { display: flex; align-items: center; gap: 7px; font-size: var(--fs-sm); color: var(--dim); }
.row .nm { width: 42px; flex: none; color: var(--fg); }
.row input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
.row .v { width: 34px; flex: none; text-align: right; color: var(--accent); }

/* who's-here list */
.who-row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
.who-row .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who-row .d { color: var(--dim); flex: none; }
.who-row.self .n { color: var(--accent); }

/* --------------------------------------------------------------- fixed hud */
#hud {
  position: fixed; top: 10px; left: 10px; z-index: 5;
  padding: 8px 11px; white-space: pre; pointer-events: none;
  font-size: var(--fs-sm); color: var(--dim);
}
#hud b { color: var(--fg); font-weight: 600; }
#hud .ok  { color: var(--accent); }
#hud .bad { color: var(--err); }
#hud .edit { color: var(--warn); }
/* Edit mode has to be legible without reading the HUD: the cursor changes and
   the viewport gets a thin warm frame, so it is obvious why a drag just moved
   a crate instead of the camera. */
body.edit-mode canvas { cursor: crosshair; }
body.edit-mode::after {
  content: ''; position: fixed; inset: 0; z-index: 2; pointer-events: none;
  border: 2px solid rgba(232, 201, 106, .5); border-radius: 3px;
}

#trayzone {
  position: fixed; right: 10px; bottom: 10px; z-index: 28;
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  max-width: min(400px, 46vw); pointer-events: none;
}
#loading { padding: 7px 10px; font-size: var(--fs-sm); color: var(--warn); white-space: pre; display: none; }
#loading.on { display: block; }
#toasts { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
.toast {
  padding: 7px 10px; font-size: var(--fs-sm); max-width: 100%;
  border-left: 3px solid var(--dim); white-space: pre-wrap; word-break: break-word;
  animation: toastin .18s ease-out; pointer-events: auto;
}
.toast.err  { border-left-color: var(--err); color: var(--err); }
.toast.warn { border-left-color: var(--warn); color: var(--warn); }
.toast.info { border-left-color: var(--accent); color: var(--fg); }
.toast .ctx { color: var(--dim); }
.toast.out { opacity: 0; transition: opacity .3s, transform .3s; transform: translateX(12px); }
@keyframes toastin { from { opacity: 0; transform: translateX(12px); } }

#hintbar {
  position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
  z-index: 4; padding: 5px 12px; font-size: var(--fs-sm); color: var(--dim);
  pointer-events: none; white-space: nowrap; max-width: 92vw; overflow: hidden;
  text-overflow: ellipsis; transition: opacity .5s;
}
#hintbar kbd { font-size: 10px; }
#hintbar.gone { opacity: 0; }

/* dock: one row of toggles so a closed frame is never lost */
#dock {
  position: fixed; top: 10px; right: 10px; z-index: 27;
  display: flex; gap: 4px; padding: 4px;
}
#dock button { padding: 4px 8px; font-size: 11px; }

/* --------------------------------------------------------------- overlays */
.scrim {
  position: fixed; inset: 0; z-index: 40; display: none;
  align-items: center; justify-content: center;
  background: rgba(4, 10, 16, 0.72); backdrop-filter: blur(4px);
  padding: 20px; box-sizing: border-box;
}
.scrim.open { display: flex; }
/* The front door sits ON the splash — arriving is one continuous moment, not a
   dialog that appears after a loading screen. Above #splash's z-index. */
#door { z-index: 120; background: rgba(4, 10, 16, 0.55); }
.sheet {
  width: min(560px, 100%); max-height: 100%; overflow-y: auto;
  padding: 20px 22px; box-sizing: border-box; position: relative;
}
.sheet h1 { font-size: 17px; margin: 0 0 3px; color: var(--accent); font-weight: 600; }
.sheet h2 {
  font-size: var(--fs-sm); margin: 16px 0 7px; color: var(--dim);
  text-transform: uppercase; letter-spacing: .09em; font-weight: 600;
}
.sheet p.sub { margin: 0 0 16px; color: var(--dim); font-size: var(--fs-sm); }
.sheet label { display: block; margin-bottom: 11px; }
.sheet label .lbl { display: block; font-size: var(--fs-sm); color: var(--dim); margin-bottom: 4px; }
.sheet label input { width: 100%; box-sizing: border-box; font-size: var(--fs); padding: 8px 10px; }
.sheet .go {
  width: 100%; text-align: center; font-size: var(--fs); padding: 10px;
  background: var(--accent-dk); border-color: var(--edge-hi); color: var(--accent); font-weight: 600;
}
.sheet .go:hover { background: #2a5349; }
.keys {
  display: grid; grid-template-columns: max-content 1fr;
  gap: 7px 14px; align-items: baseline;
}
.keys dt { text-align: right; color: var(--dim); white-space: nowrap; }
.keys dd { margin: 0; color: var(--fg); }
kbd {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  background: rgba(30, 60, 55, .8); border: 1px solid var(--edge);
  font: 11px var(--font); color: var(--accent); white-space: nowrap;
}
.close-x {
  position: absolute; top: 12px; right: 14px; padding: 3px 8px;
  font-size: var(--fs); background: none; border: none; color: var(--dim);
}

/* photo mode hides every chrome layer but keeps the canvas */
body.photo .frame, body.photo #hud, body.photo #trayzone,
body.photo #hintbar, body.photo #dock { display: none !important; }

#touch { position: fixed; inset: 0; z-index: 3; display: none; pointer-events: none; }
body.touch #touch { display: block; }
#stick {
  position: absolute; left: 18px; bottom: 18px; width: 116px; height: 116px;
  border-radius: 50%; border: 1px solid var(--edge); background: rgba(9,20,28,.5);
  pointer-events: auto; touch-action: none;
}
#stick .nub {
  position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border-radius: 50%; background: rgba(143,232,200,.28); border: 1px solid var(--edge-hi);
}
#touchbtns { position: absolute; right: 18px; bottom: 18px; display: flex; gap: 8px; pointer-events: auto; }
#touchbtns button { padding: 13px 15px; font-size: var(--fs); border-radius: 50%; }
.dbg-row { cursor: pointer; user-select: none; }
.dbg-row input { accent-color: var(--accent); margin: 0; }
.dbg-stats {
  margin: 2px 0 0; padding: 6px 7px; font: 11px/1.45 ui-monospace, monospace;
  color: var(--dim); background: rgba(0,0,0,0.25); border-radius: 5px;
  white-space: pre; overflow-x: auto;
}
</style>

<script>
// The early socket (TEL0S_NOTES §4): open the wire and send the join NOW —
// inline, zero imports, before the module graph is even requested — so the
// snapshot downloads while the 2.1MB engine parses and the GPU wakes.
// net.js ADOPTS this socket at connect() only if the join it sent is
// byte-for-byte the one net would send; any mismatch closes it unadopted.
// Inline rather than a file: a separate script would cost a blocking fetch
// on exactly the RTT this exists to save. Eligibility is the common
// returning-resident path only — first-run visitors get the door first,
// spectators/renderers take the normal path, ?earlysock=0 disables.
(() => {
  try {
    const params = new URLSearchParams(location.search);
    if (params.get('earlysock') === '0') return;
    if (params.has('spectate') || params.has('renderer') || params.has('mintthumbs')) return;
    const name = params.get('name')
      || (localStorage.getItem('ew-name-set') === '1' ? localStorage.getItem('ew-name') : null);
    if (!name) return;   // the first-run door decides identity — never preempt it
    const world = params.get('world') || 'commons';
    const token = params.get('key') || localStorage.getItem('ew-key') || '';
    const want = params.get('avatar') || localStorage.getItem('ew-avatar-name') || 'claude';
    let avatar = want;   // a bare name: the server resolves it against the roster
    try {
      const c = JSON.parse(localStorage.getItem('ew-avatar-path') ?? 'null');
      if (c && c.name === want && typeof c.path === 'string') avatar = c.path;
    } catch (e) { /* a bare name is fine */ }
    const sent = { world, id: name, avatar, token };
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    const stash = { ws, sent, buffered: [], failed: false, closeInfo: null };
    globalThis.__ewEarlySocket = stash;
    ws.onopen = () => ws.send(JSON.stringify({ type: 'join', world, id: name, avatar, spectate: false, renderer: false, token }));
    ws.onmessage = (ev) => {
      stash.buffered.push(ev.data);
      if (stash.buffered.length > 5000) {   // a runaway stream: bail to the normal path
        stash.failed = true;
        try { ws.close(); } catch (e) { /* dying */ }
      }
    };
    ws.onerror = () => { stash.failed = true; };
    ws.onclose = (ev) => { stash.failed = true; stash.closeInfo = { code: ev.code, reason: ev.reason }; };
  } catch (e) { /* the normal connect path exists precisely for this */ }
})();
</script>
<!-- The engine is 2.1MB discovered at waterfall depth 3 (HTML -> main.js ->
     three.webgpu.js) unless declared here: modulepreload starts the fetch
     +parse the moment the HTML lands, in parallel with main.js and the GPU
     init. Only the STATIC graph belongs in this list — rapier is a dynamic
     import behind a user action and preloading it would tax the very
     window this exists to shorten. -->

<!-- Static so it paints before any module loads. boot.js only fills it in. -->
<div id="splash">
  <div class="sp-mark">eidoverse</div>
  <div class="sp-sub">stepping into <b class="sp-world">a world</b> as <b class="sp-name">…</b></div>
  <div class="sp-bar"><div class="sp-bar-fill"></div></div>
  <div class="sp-status"><span class="sp-phase">waking the engine</span><span class="sp-detail"></span></div>
  <div class="sp-tip"></div>
  <button class="sp-skip">go in anyway →</button>
</div>

<div id="hud" class="panel">connecting…</div>
<div id="dock" class="panel"></div>

<div id="trayzone">
  <div id="loading" class="panel"></div>
  <div id="toasts"></div>
</div>

<div id="hintbar" class="panel"></div>

<div id="touch">
  <div id="stick"><div class="nub"></div></div>
  <div id="touchbtns"></div>
</div>

<div id="door" class="scrim"><div class="sheet panel"></div></div>
<div id="help" class="scrim"><div class="sheet panel"></div></div>

<script>
  // Boot watchdog — pre-module, zero imports. A failed or hanging module
  // graph (missing client/node_modules on a fresh clone, a browser without
  // WebGPU) used to leave this splash saying "waking the engine" forever,
  // name "…", nothing anywhere — the least debuggable failure the client
  // had. The truth now lands ON the splash: any uncaught error or
  // rejection before the engine marks itself up is shown, and twenty
  // silent seconds earn a diagnosis hint. core.js sets __ewEngineUp after
  // renderer.init() — module resolution AND the GPU both proven.
  (() => {
    const phase = () => document.querySelector('.sp-phase');
    const fail = (msg) => {
      const el = phase();
      if (globalThis.__ewEngineUp || !el) return;
      el.textContent = msg;
      el.style.color = '#ff9d8a';
    };
    addEventListener('error', (e) => fail(
      `the engine failed to load — ${e.message || (e.target && e.target.src) || 'see the console'}`));
    addEventListener('unhandledrejection', (e) => fail(
      `the engine failed to start — ${(e.reason && e.reason.message) || e.reason || 'see the console'}`));
    setTimeout(() => {
      if (globalThis.__ewEngineUp) return;
      fail('still waking after 20s — open the console. Fresh checkout? run: cd client && bun install. And the client needs WebGPU (current Chrome).');
    }, 20000);
  })();
</script>
<script type="module" src="./main.js"></script>
</body>
