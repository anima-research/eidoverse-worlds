#dock button:not(.dock-grip):not(.on) svg { opacity: .8; }
#dock button:not(.dock-grip):hover svg, #dock button.on svg { opacity: 1; }
#dock #hud.emark.net-live svg { opacity: 1; }   /* the live ∃ is never dimmed: the :not(.on) .8 above was reaching it (measured 09-04 23:52 — 'dingy') */
#dock button:not(.dock-grip):hover { color: var(--fg); background: var(--hov); }
/* The ON look must not be loud or distracting, and quieting it moves OFF
   too, so both are drawn together; the ∃ mark is untouched.
   The dock is an ACTIVITY BAR, not a tool palette: each button opens a window,
   and the rail knows which screen edge it is welded to. The reference for that
   shape is VS Code's activity bar — a thin accent border on the content-facing
   edge + the icon going dim→full; a filled background is explicitly optional
   there and Figma/Blender's lit wells are for mode toggles. So:
     OFF   dim icon, no fill (unchanged)            HOVER  faint --hov well (unchanged)
     ON    full-brightness brand-tinted icon + a 2px brand bar on the edge that
           faces the viewport (it points at the window it opened); no well, no ring
     ON+HOVER  a whisper of well so about-to-close still differs from about-to-open */
/* a gated action (the edit wrench without build rights): listed, not offered —
   the same vocabulary #emenu .mrow.dead uses for an unsensed headset */
#dock button:not(.dock-grip).dead { opacity: .42; cursor: not-allowed; }
/* `inherit` here resolved to #dock's computed color — which inherits --fg from
   body — i.e. exactly the ink this reset means to suppress, so a gated wrench
   brightened to full white on hover like a live one. Name the rest-state token
   instead. (round 6, measured: dead hover was rgb(235,235,233), identical to
   a live button's.) */
#dock button:not(.dock-grip).dead:hover { color: var(--icon); background: none; }

#dock button.on {
  position: relative;
  color: var(--brand);   /* the accent itself — one ink with the ∃ and the live mic/ear (live, 09-04 23:59) */
  background: none;
}
#dock button.on::before {
  content: ''; position: absolute; border-radius: 2px;
  background: var(--brand); opacity: .9;
  /* default (rail welded left / floating top-left): bar on the RIGHT edge */
  top: 7px; bottom: 7px; right: -3px; width: 1.5px;   /* a smidge thinner than 2 (live, 09-04) */
}
#dock[data-edge="right"]  button.on::before { right: auto; left: -3px; }
#dock[data-edge="top"]    button.on::before { top: auto; right: 7px; left: 7px; bottom: -3px; width: auto; height: 1.5px; }
#dock[data-edge="bottom"] button.on::before { bottom: auto; right: 7px; left: 7px; top: -3px; width: auto; height: 1.5px; }
#dock button.on:hover {
  color: color-mix(in srgb, var(--brand) 45%, white);
  background: color-mix(in srgb, var(--brand) 10%, var(--hov));
}
/* two weights per button: line at rest, fill when on (live, 09-04) */
#dock button:not(.dock-grip) svg.ico-line + svg { display: none; }
#dock button:not(.dock-grip).on svg.ico-line { display: none; }
#dock button:not(.dock-grip).on svg.ico-line + svg { display: inline; }
#dock button[hidden] { display: none; }
/* keybtn: buttons that mirror physical KEYS read as key-caps — a darker well,
   no outline (the doctrine: visible boxes only for key-mirrors and committal actions) */
button.keybtn { background: var(--well); border: none; box-shadow: none; border-radius: 7px; }
button.keybtn:hover { background: color-mix(in srgb, var(--well) 60%, var(--hov)); }
button.keybtn:active { box-shadow: inset 0 1px 3px rgb(0 0 0 / .6); }
/* the rail WELDS to its edge — it is part of the window frame, not a floating card */
#dock[data-edge="left"]   { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: none; }
#dock[data-edge="right"]  { border-top-right-radius: 0; border-bottom-right-radius: 0; border-right: none; }
#dock[data-edge="top"]    { border-top-left-radius: 0; border-top-right-radius: 0; border-top: none; }
#dock[data-edge="bottom"] { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: none; }
#dock.horizontal { flex-direction: row; }
/* height:100% cannot resolve here — #dock sets `align-items: center`, so the
   grip never stretches and there is no definite height to percentage against.
   It collapsed to its SVG's intrinsic 6px: a 14x6 drag target, on the landscape
   phone edge that loadDockEdge() picks BY DEFAULT when the rail cannot clear
   the joystick. align-self overrides the centring. (round 6, measured 14x6 vs
   the vertical rail's 34x14.) */
#dock.horizontal .dock-grip { width: 14px; height: auto; align-self: stretch; }
/* ------------------------------------------------------------- profile */
.frame .profile-body { padding: 14px; gap: 12px; }
.pf-id { display: flex; align-items: center; gap: 12px; }
.pf-who { display: flex; flex-direction: column; min-width: 0; }
.pf-who > b { font-size: 17px; font-weight: 650; }
.pf-who > span { color: var(--dim); font-size: var(--fs-sm); }
.pf-who > span b { color: var(--fg); font-weight: 550; }
 /* 🔴 TILES — the one tile, shared: profile's stubs and the emote menu both use it.
   A tile is a quiet well with an icon/glyph, a name, and an optional note or key.
   .on = lit (the playing emote, the chosen thing). No private tile rules. */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1; min-height: 0; }
/* emote tiles are FIXED width and flow: widen the frame and they go to one
   line; the frame snaps to whole tiles on release (emotebar.js). Even gutters. */
.tiles.fixed { grid-template-columns: repeat(auto-fill, 32px); grid-auto-rows: 32px; gap: 6px; justify-content: center; align-content: start; flex: none; padding: 0; }   /* 30 px buttons, 6 px gutters: 'bring back the buffers and put the buttons on a diet' (live 09-05 22:00) */
.tile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  gap: 3px; padding: 12px 14px; border-radius: 9px;
  background: rgb(255 255 255 / .04); border: none; color: var(--fg);
}
.tile:hover { background: rgb(255 255 255 / .09); }
.tile.on { background: color-mix(in srgb, var(--brand) 16%, rgb(255 255 255 / .04)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 45%, transparent); }
.tile svg { opacity: .9; margin-bottom: 3px; color: var(--icon); }   /* icons carry the brand whisper everywhere, stubs included (live, 09-04) */
.tile b { font-size: var(--fs); font-weight: 600; }
.tile span { color: var(--dim); font-size: var(--fs-xs); }
.tile .tile-glyph { font-size: 22px; line-height: 1; color: inherit; }   /* the gesture is content, drawn large */
.tile kbd { position: absolute; top: 6px; right: 7px; font-size: var(--fs-xs); opacity: .6; }
.tiles.fixed .tile { width: 32px; height: 32px; box-sizing: border-box; padding: 0; align-items: center; justify-content: center; gap: 0; line-height: 1; overflow: visible; border-radius: 7px; }   /* 32: the glyph's own size plus 4 px; gutters stay 6 (live 22:25). Centred: any remainder splits evenly left/right; rows never stretch. */
.tiles.fixed .tile .tile-glyph { font-size: 20px; }
.tile .tile-word { font-size: var(--fs-xs); line-height: 1.1; padding: 0 3px; word-break: break-word; text-align: center; }   /* the fallback when the emoji does not render here */
/* alt held = every frame is grabbable, and says so */
body.altgrab .frame { cursor: grab; }
body.altgrab .frame:active { cursor: grabbing; }
/* scene-tree selection: text brightens toward the accent, same selected-
   speaks-accent grammar as tabs/heads/dock */
.sg-row.sel { background: rgb(255 255 255 / .06); }
.sg-row.sel .n b { color: color-mix(in srgb, var(--brand) 45%, var(--fg)); }
.sg-row.sel .d { color: color-mix(in srgb, var(--brand) 25%, var(--dim)); }

/* --------------------------------------------------------------- overlays */
.scrim {
  position: fixed; inset: 0; z-index: 40; display: none;
  align-items: center; justify-content: center;
  /* a NEUTRAL veil — mid gray at half strength desaturates whatever world is
     behind it and clashes with none of them; the old blue-black fought warm
     skies (live, 09-05) */
  background: rgb(128 128 128 / .5); backdrop-filter: blur(4px);
  padding: 20px; box-sizing: border-box;
}
.scrim.open { display: flex; }
/* The front door sits ON the splash — arriving is one continuous moment, not a
   dialog that appears after a loading screen. Above #splash's z-index. */
/* the door's veil is near-black, not mid-grey: the sheet is translucent and a grey veil
   under it read as dingy (live, 09-06 22:37) */
#door { z-index: 120; background: rgb(8 12 14 / .62); }
.sheet {
  width: min(560px, 100%); max-height: 100%; overflow-y: auto;
  padding: 20px 22px; box-sizing: border-box; position: relative;
}
/* the door is a frame like the others: its title follows .fr-title (live, 09-04: the card read as the old menu styling) */
.sheet h1 { font-size: var(--fs-sm); margin: 0 0 6px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .085em; }
/* the door wears the frames' own header: a title chip on the top edge (the
   fr-head/fr-title grammar), then the panel body — not a headline in a box */
#door .sheet { padding: 0; overflow: visible; background: rgb(var(--panel-rgb) / .94); border: 1px solid rgb(255 255 255 / .14); box-shadow: 0 0 0 1px rgb(0 0 0 / .5), 0 24px 60px rgb(0 0 0 / .5); }   /* the one surface at arrival — solid, with a modest rim so it holds against a dark world (live, 09-06 23:08) */
#door .sheet .fr-head { position: static; display: flex; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--edge); border-radius: var(--r) var(--r) 0 0; background: rgb(var(--panel-rgb) / .35); cursor: default; }
#door .sheet .fr-title { flex: 1; font-size: var(--fs-sm); color: var(--dim); text-transform: none; letter-spacing: .02em; font-weight: 500; }
#door .sheet .fr-title b { color: var(--fg); font-weight: 600; }
#door .sheet .door-body { padding: 16px 18px 18px; max-height: calc(100vh - 120px); overflow-y: auto; }
#door .sheet h2 { margin: 16px 0 8px; }
#door .sheet h2:first-child { margin-top: 0; }
#door .sheet label { margin-bottom: 4px; }
#door .sheet label input::placeholder { color: color-mix(in srgb, var(--dim) 70%, transparent); }
#door .sheet label input { background: var(--well); border: 1px solid var(--edge); border-radius: 7px; color: var(--fg); }
#door .sheet label input:focus { outline: none; border-color: color-mix(in srgb, var(--brand) 60%, var(--edge)); }
#door .sheet p.sub a { color: var(--brand); }
#door .grid.dense { gap: 6px; }
/* cards sit a step LIGHTER than the sheet, not sunk into it; the name is body-size, not caption-size (live, 09-06 23:08) */
#door .card { background: color-mix(in srgb, rgb(var(--panel-rgb)) 78%, white 6%); border: 1px solid rgb(255 255 255 / .09); border-radius: 7px; padding: 5px 5px 6px; color: var(--fg); font-size: 13px; line-height: 1.25; }
#door .card span { opacity: .85; }
#door .card.on span { opacity: 1; color: var(--brand); }
/* portraits are people: 3:4, not squares — and the grid is always five across
   so a second row lines up under the first */
#door .grid.dense { display: grid; grid-template-columns: repeat(5, 1fr); }
#door .card img, #door .card .ph { aspect-ratio: 3 / 4; }
.sec > .body .av-grid .card { align-self: stretch; width: auto; align-items: stretch; }   /* fill the grid cell. The house rule `.sec > .body button { align-self:flex-start; width:fit-content }` hit these <button> cards, so each took the width of its NAME — as many sizes as names (screenshot, 09-05) */
.av-shot { position: relative; width: 100%; aspect-ratio: 3 / 4; border-radius: 4px; overflow: hidden; background: rgba(0,0,0,.35); }   /* World › avatar: the box sizes the card; the image only fills it */
.av-shot .ph { display: grid; position: absolute; inset: 0; width: auto; aspect-ratio: auto; }
.av-shot img { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; object-fit: cover; }
#door .sheet .go b { font-weight: 700; }
#door .card:hover { border-color: var(--edge); color: var(--fg); }
#door .card.on { border-color: var(--brand); }
.sheet h2 {
  font-size: var(--fs-sm); margin: 16px 0 7px; color: var(--dim);
  text-transform: uppercase; letter-spacing: .09em; font-weight: 600;
}
.sheet p.sub { margin: 0 0 16px; color: var(--dim); font-size: var(--fs-sm); }
.sheet label { display: block; margin-bottom: 11px; }
.sheet label .lbl { display: block; font-size: var(--fs-sm); color: var(--dim); margin-bottom: 4px; }
.sheet label input { width: 100%; box-sizing: border-box; font-size: var(--fs); padding: 8px 10px; }
.sheet .go {
  width: 100%; text-align: center; font-size: var(--fs); padding: 12px 16px; margin-top: 22px;
  /* the one action on the sheet: outlined in the brand, a light brand wash, the text free to wrap —
     an outline says 'important' without a slab of colour (live, 09-06 22:37; supersedes the 09-05 solid fill) */
  background: color-mix(in srgb, var(--brand) 12%, transparent); border: 1.5px solid var(--brand);
  color: var(--fg); font-weight: 600; border-radius: 8px; white-space: normal; line-height: 1.35;
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--brand) 30%, transparent); transition: background .15s, box-shadow .15s;
}
.sheet .go:hover, .sheet .go:focus-visible { background: color-mix(in srgb, var(--brand) 22%, transparent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent); outline: none; }
#door .sheet .go b { color: var(--brand); }
.keys {
  display: grid; grid-template-columns: max-content 1fr;
  gap: 7px 14px; align-items: baseline;
}
.keys dt { text-align: right; color: var(--dim); white-space: nowrap; }
.keys dd { margin: 0; color: var(--fg); }
kbd {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  background: rgb(0 0 0 / .35); border: 1px solid var(--edge);
  font: var(--fs-xs) var(--font-code); color: var(--fg); white-space: nowrap;
}
.close-x {
  position: absolute; top: 12px; right: 14px; padding: 3px 8px;
  font-size: var(--fs); background: none; border: none; color: var(--dim);
}

/* the lite client's "Light version" card (lite.js liteBanner). The full client's capability notices were the same card
   and are now chips on the status strip (#hudstatus below, statuschips.js); lite.js places this one under its emote row
   inline. The history of the old placements is in git (#185 B2). */
.capnotice {
  position: fixed; left: 50%; transform: translateX(-50%); top: 8px; z-index: 95;   /* top-centre, over everything until dismissed (owner, 09-27; capnotice.js says why) */
  max-width: min(320px, 46vw);   /* NARROW, not merely right-anchored: at 720px the card still reached back across the centred emote bar and blocked 7 of 9 tiles even from top-right. The long text is the title tooltip anyway (09-05 note above). #185 B2. */ padding: 5px 10px; font-size: var(--fs-sm); line-height: 1.4;
  display: flex; flex-direction: row; align-items: center; gap: 10px; border-radius: 8px;
  border: 1px solid color-mix(in srgb, var(--attn) 70%, transparent); background: color-mix(in srgb, var(--attn) 10%, var(--bg));   /* THE attention amber: a message they must click through (owner, 09-19) */
}

/* A PHONE HAS NO ROOM IN THE TOP STRIP (antra-tess #185 B2, measured 2026-09-12).
   The emote bar is widthFor(9)=352px and never narrower at its default, so at
   390px wide there are 38px beside it. Three separate occluders were measured in
   that strip: this card (5 of 9 tiles), #dock once body.touch reorients the rail
   along the top edge in landscape (1 tile), and #earbtn at z45 (1 tile). Moving
   the card to the right corner cleared it at 1280x720 and 1904x844 and still left
   five tiles covered on a phone; dropping it to full width at top:62 cleared the
   tiles and covered a DOCK BUTTON instead. The band below the bar and right of
   the rail is the one rectangle measured clear of #dock, #micbtn, #earbtn,
   #emenu, #stick and #hintbar in BOTH orientations. The card is transient chrome
   on a reduced-capability browser and it yields; the bar is a primary control. */
@media (max-width: 900px) {
  .capnotice { left: 50px; right: 8px; max-width: none; transform: none; }   /* stretched on a phone */
}

.capnotice > * { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; min-width: 0; flex: 1; }   /* title + text, buttons wrap under */
.capnotice b { display: inline; margin: 0; white-space: nowrap; color: var(--attn); }
.capnotice p { margin: 0; color: var(--dim); flex: 1 1 100%; font-size: var(--fs-sm); line-height: 1.35; }   /* its own full-width line under the title; `flex:1; min-width:0` in a wrapping row shrank it to one word per line (owner, 09-19: 'go home you're drunk') */   /* wraps — the 09-12 ellipsis left 'T…' beside the title (owner, 09-19) */
.capnotice .cn-btns { display: flex; gap: 6px; flex: none; }
.capnotice .cn-btns button { padding: 4px 10px; font-size: var(--fs-xs); }
/* photo mode hides every chrome layer but keeps the canvas */
body.photo .frame, body.photo #hud, body.photo #trayzone,
body.photo #hintbar, body.photo #dock, body.photo #lantern-pill,
body.photo #hudstatus, body.photo #stpop, body.photo #platecard { display: none !important; }

/* THE STATUS STRIP (statuschips.js): small pills on the ∃'s status line, past the mic/ear glyphs — "WebGL 2 ⓘ",
   "reduced detail", "graphics reset". Amber = a caveat, red = a failure. statuschips.js writes left/top; the strip runs
   along the ∃'s row on a vertical rail and down (up) its column on a horizontal one. z 45: the glyphs' own layer —
   over frames (≤25), the rail (27) and the ∃ menu (40, which opens clear of it), under hints/toasts (60). */
#hudstatus { position: fixed; z-index: 45; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }   /* wraps when the row runs out (statuschips.js sets max-width to the room) */
#hudstatus[hidden] { display: none; }
#hudstatus[data-edge="right"] { flex-direction: row-reverse; }
#hudstatus[data-edge="top"] { flex-direction: column; flex-wrap: nowrap; align-items: flex-start; }
#hudstatus[data-edge="bottom"] { flex-direction: column-reverse; flex-wrap: nowrap; align-items: flex-start; }
.stchip {
  --c: var(--attn);
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 9px; border-radius: 999px;
  font: var(--fs-xs) var(--font); letter-spacing: .01em; color: var(--c); white-space: nowrap; cursor: pointer;
  background: var(--chip); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.stchip[data-level="err"] { --c: var(--err); }
.stchip svg { opacity: .75; flex: none; }
.stchip:hover, .stchip[aria-expanded="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, var(--chip)); }
.stchip:hover svg, .stchip[aria-expanded="true"] svg { opacity: 1; }
#stpop {
  --c: var(--attn);
  position: fixed; z-index: 46; width: min(300px, calc(100vw - 16px)); box-sizing: border-box; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 6px; font-size: var(--fs-sm); line-height: 1.4; border-radius: 8px;
  border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
  background: color-mix(in srgb, var(--c) 8%, rgb(var(--panel-rgb) / .96));   /* floats over the world: near-opaque, like the chat gear pop */
}
#stpop[hidden] { display: none; }
#stpop[data-level="err"] { --c: var(--err); }
#stpop b { color: var(--c); font-weight: 600; }
#stpop p { margin: 0; color: var(--dim); }
#stpop .st-btns { display: flex; gap: 6px; margin-top: 4px; }
#stpop .st-btns button { padding: 4px 10px; font-size: var(--fs-xs); }
/* THE PRE-VR MIC STEP (vrmic.js): the door's grammar at a third of its size — title chip, a sentence, one outlined action.
   Over the visor (#xrbtn sits at z 45), under the door (120). */
#vrmic { z-index: 50; background: rgb(8 12 14 / .62); }
#vrmic .sheet { width: min(380px, 100%); padding: 0; overflow: visible; background: rgb(var(--panel-rgb) / .96); border: 1px solid rgb(255 255 255 / .14); box-shadow: 0 0 0 1px rgb(0 0 0 / .5), 0 24px 60px rgb(0 0 0 / .5); }
#vrmic .fr-head { display: flex; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--edge); background: rgb(var(--panel-rgb) / .35); }
#vrmic .fr-title { font-size: var(--fs-sm); color: var(--fg); font-weight: 600; letter-spacing: .02em; }
#vrmic .vrmic-body { padding: 14px 16px 16px; }
#vrmic .vrmic-say { margin: 0 0 8px; line-height: 1.45; }
#vrmic .sheet p.sub { margin: 0; }
#vrmic .vrmic-btns { display: flex; gap: 8px; align-items: stretch; margin-top: 16px; }
#vrmic .vrmic-btns .go { margin-top: 0; flex: 1; padding: 9px 14px; }
#vrmic .vrmic-btns button:not(.go) { padding: 9px 14px; }

/* THE NAMEPLATE CARD (platecard.js): an in-world tooltip beside a person's nameplate — hover a plate 300 ms, or tap it
   on a touch screen. The status-chip popover's recipe in the neutral edge instead of amber: nothing here is a caveat.
   z 9: a thing in the world, so every panel (frames.js Z_LO 10 … 25) and all chrome sit over it as it follows. */
#platecard {
  position: fixed; z-index: 9; min-width: 150px; max-width: min(220px, calc(100vw - 16px)); box-sizing: border-box;
  padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-sm); line-height: 1.35;
  border-radius: 8px; border: 1px solid var(--edge-hi); background: rgb(var(--panel-rgb) / .94);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); pointer-events: auto;
  animation: platecard-in .12s ease-out;
}
@keyframes platecard-in { from { opacity: 0; } }
#platecard[hidden] { display: none; }
#platecard .pc-head { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; min-width: 0; }
#platecard .pc-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
#platecard .pc-name { font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
#platecard .pc-pres { font-size: var(--fs-xs); color: var(--dim); flex: none; }
#platecard .pc-pres[data-presence="away"] { color: var(--attn); }
#platecard .pc-pres[data-presence="busy"] { color: var(--err); }
#platecard .pc-row { display: flex; align-items: center; gap: 6px; color: var(--dim); }
#platecard .pc-row svg { flex: none; opacity: .8; }
#platecard .pc-row[data-on="true"] { color: var(--fg); }
#platecard .pc-row[data-on="true"] svg { color: var(--ok); opacity: 1; }
#platecard .pc-where { margin-left: auto; padding-left: 8px; font-size: var(--fs-xs); color: var(--dim); flex: none; }
#platecard .pc-btns { display: flex; gap: 6px; margin-top: 4px; }
#platecard .pc-btns button { padding: 4px 10px; font-size: var(--fs-xs); }
/* VR: the same card rasterised onto a quad beside the plate (platecard.js). The quad has no world behind it to blur or
   see through, so it is opaque like the VR panels; no fade-in (a raster taken mid-fade would keep it); the "message"
   button opens a desktop tab, so it is not drawn there. */
#platecard[data-xr] { animation: none; backdrop-filter: none; -webkit-backdrop-filter: none; background: rgb(var(--panel-rgb)); }
#platecard[data-xr] .pc-btns { display: none; }

#touch { position: fixed; inset: 0; z-index: 3; display: none; pointer-events: none; }
body.touch #touch { display: block; }
#stick {
  position: absolute; left: 18px; bottom: 18px; width: 116px; height: 116px;
  border-radius: 50%; border: 1px solid var(--edge); background: rgba(9,20,28,.5);
  pointer-events: auto; touch-action: none;
}
#stick .nub {
  position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border-radius: 50%; background: color-mix(in srgb, var(--brand) 28%, transparent); border: 1px solid var(--edge-hi);
}
#touchbtns { position: absolute; right: 18px; bottom: 18px; display: flex; gap: 8px; pointer-events: auto; }
#touchbtns button { padding: 13px 15px; font-size: var(--fs); border-radius: 50%; }
/* ------------------------------------------------------- perfscope (debug) */
.perf-loupe {
  position: fixed; z-index: 55; pointer-events: none;
  /* shrink to content (no left gutter). The old
     min-width floor + the grid's 1fr stretch column dumped all slack as empty
     space on the left; width:max-content lets the card hug its rows, still
     bounded by max-width for pathological long names. */
  width: max-content; max-width: 320px; padding: 9px 8px 7px; border-radius: 8px;
  font: var(--fs-xs)/1.5 var(--font-code); color: var(--fg);
  background: rgb(var(--panel-rgb) / .94);   /* floats over content: near-opaque */
  box-shadow: 0 6px 20px rgb(0 0 0 / .45), var(--rim);
  opacity: 0; transition: opacity .1s;
}
.perf-loupe.show { opacity: 1; }
/* pinned → hoverable, so every `title` tooltip on the rows actually fires
   (unpinned the card is pointer-events:none to follow the cursor & let the
   raycast through). */
.perf-loupe.pinned { pointer-events: auto; }
/* Maya channel-box grid: label right-justified against the center
   seam · value right-justified against the pill column (buffer via column-gap)
   · tier pill. Two clean vertical rules; nothing floats apart, nothing bumps
   the panel wide. auto-sized columns so the panel fits its content. */
.perf-loupe .pl-grid {
  display: grid;
  /* all three columns size to content — nothing stretches, so the card is only
     as wide as label+value+pill actually need (no left gutter). */
  grid-template-columns: auto auto auto;
  align-items: center;
  column-gap: 8px; row-gap: 3px;
}
.perf-loupe .pll { color: var(--dim); text-align: right; }
.perf-loupe .plv { color: var(--fg); text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.perf-loupe .plp { display: flex; justify-content: flex-start; }
/* stacked texture sub-rows span all three columns; each is dims … bytes */
/* textures as their own inner table with a center break: dims
   right-justified against the seam, size left-justified after it — the main
   grid's channel-box grammar, nested and indented under "textures". */
.perf-loupe .pl-texwrap {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: 1fr 1fr;
  column-gap: 10px; row-gap: 1px;
  padding: 1px 0 2px; margin-left: 14px;
  font-size: var(--fs-xs); color: var(--dim); opacity: .85;
}
.perf-loupe .pl-texd { text-align: right; }
.perf-loupe .pl-texb { text-align: left; color: var(--fg); opacity: .8; font-variant-numeric: tabular-nums; }
.perf-loupe .pl-texwrap em { font-style: normal; color: var(--attn); opacity: .85; }
/* header: name (left) + a right-aligned VERDICT STACK (pill · lens ·
   rank) — the three tightly-coupled perf facts grouped under the pill. 'placed
   by' dropped (provenance, not perf). Header is now just name | verdict.
   To fill the blank between the label and the pill, the verdict
   pieces are RIGHT-FLOATS — pill first, lens+rank cleared beneath it — and the
   name is a plain block whose LINES flow around them. Floats are the one CSS
   mechanism that gives each text line its own width: title line 1 wraps at the
   pill's left edge (filling the old blank), line 2 wraps at the wider lens
   label's edge (keeping its distance from 'texture memory'), and both widths
   come from the real rendered pill/label — nothing hardcoded. flow-root
   contains the floats; width:0 + min-width:100% keeps the header from
   contributing to the pane's max-content width, so the data table still sets
   pane width exactly as before. */
.perf-loupe .pl-head {
  display: flow-root; width: 0; min-width: 100%; color: var(--fg);
  padding-bottom: 4px; margin-bottom: 4px; border-bottom: 1px solid var(--edge);
}
.perf-loupe .pl-verdict { display: contents; }
.perf-loupe .pl-rank { float: right; margin: 0 0 4px 8px; }
.perf-loupe .pl-verdictsub {
  float: right; clear: right; margin-left: 8px;
  display: flex; flex-direction: column; align-items: flex-end; text-align: right;
}
/* name: plain block so its line boxes shorten beside the floats (any BFC-maker
   — overflow, -webkit-box, flex — would dodge the floats as a whole rectangle
   and give every line the same narrow width again). Clamped to 2 lines by
   standard line-clamp where it exists; the fallback clips at 2 lines via
   max-height + clip-path (clip-path clips at paint time without creating a
   BFC — overflow:hidden would). */
.perf-loupe .pl-name {
  display: block; position: relative;
  font-size: 12px; font-weight: 700; line-height: 1.3;
  overflow-wrap: anywhere; hyphens: auto;
  /* three lines when the verdict stack leaves the room — the
     stack is already three rows tall, so a third name line costs no height. */
  max-height: calc(3 * 1.3em); clip-path: inset(0);
}
/* provenance under the name: the GLB basename, dim and small, flowing around the
   same floats (the name no longer carries the filename) */
.perf-loupe .pl-lib {
  display: block; font-size: var(--fs-xs); font-weight: 400; line-height: 1.3;
  color: var(--dim); opacity: .85; overflow-wrap: anywhere; margin-top: 1px;
  max-height: calc(2 * 1.3em); clip-path: inset(0);   /* two dim lines have said everything a filename will */
}
/* hand-drawn truncation cue: perfscope.js measures the last visible line and
   pins this at its end (standard line-clamp is off the table here — see above —
   and its support varies, so ONE deterministic path for every browser). */
.perf-loupe .pl-ell { position: absolute; font-style: normal; }
.perf-loupe .pl-verdict .pl-mode,
.perf-loupe .pl-verdict .pl-rankrow { color: var(--dim); font-size: var(--fs-xs); line-height: 1.3; }
.perf-loupe .pl-verdict .pl-rankrow { font-variant-numeric: tabular-nums; }
/* action hint right-justified — echoes the panel's right edge and reads as
   chrome/affordance, not data */
.perf-loupe .pl-foot { color: var(--dim); font-size: var(--fs-xs); margin-top: 4px; opacity: .75; border-top: 1px solid var(--edge); padding-top: 4px; text-align: right; }
.ps-badge {
  display: inline-block; min-width: 8px; height: 8px; border-radius: 4px;
  color: var(--ink-on-brand); font-size: var(--fs-xs); font-weight: 700; line-height: 1;
  padding: 1px 4px; vertical-align: 1px;
}
/* chunky labeled pills (readable performance pills):
   the tier WORD in a solid rounded chip, dark ink on the tier color. Same chip
   for row pills and the header rank pill, header just a hair larger + uppercase. */
/* chunky labeled pill — inline-FLEX centering fixes the old off-center text
   (the text sat off-center): the base .ps-badge's height:8px +
   line-height:1 + vertical-align shoved the label up, and trailing letter-
   spacing pushed it left. Flex-center owns both axes; a text-indent equal to
   the letter-spacing cancels the trailing-gap lean. */
.ps-badge-lg {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 34px; height: 17px; border-radius: 5px; padding: 0 8px;
  font-size: var(--fs-xs); font-weight: 700; vertical-align: middle;
  letter-spacing: .04em; text-indent: .04em;
  /* dark outline so a bright pill stays legible over a light pane */
  border: 1px solid rgb(0 0 0 / .5);
  /* OPTICAL cap centering (measured): "POOR" ink is 8px ascent + 1px
     descent around the baseline. Flex-centering the LINE box leaves the caps
     high. Setting line-height to the content box + a measured padding-top puts
     the INK, not the line box, at true center. Tuned by re-measuring ink gaps. */
  line-height: 14px; padding-top: 1px; padding-bottom: 0;
}
.perf-loupe .pl-head .ps-badge-lg { height: 18px; font-size: var(--fs-xs); line-height: 15px; padding-top: 1px; text-transform: uppercase; letter-spacing: .06em; text-indent: .06em; }
.perf-loupe .pl-rank { cursor: help; }
.ps-legend { display: flex; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--dim); padding: 2px 2px 0; }
.ps-legend i { width: 16px; height: 7px; border-radius: 2px; }
.ps-legend span { margin-left: 7px; letter-spacing: .02em; }
.ps-table { display: flex; flex-direction: column; gap: 1px; margin-top: 2px; }
.ps-row {
  display: flex; align-items: center; gap: 6px; padding: 2px 4px;
  font-size: var(--fs-xs); border-radius: 4px; cursor: pointer;
}
.ps-row:hover { background: var(--hov); }
.ps-row i { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.ps-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.ps-row em { flex: none; font-style: normal; color: var(--dim); font-variant-numeric: tabular-nums; }

/* the house tooltip (ui.js owns the behavior) — native title= chrome can't be
   styled, so it's borrowed on hover and repainted as one of our chips */
#tipchip {
  position: fixed; z-index: 60; pointer-events: none;
  max-width: 320px; padding: 4px 10px; border-radius: 6px;
  font-size: var(--fs-sm); line-height: 1.45; color: var(--fg);
  background: var(--chip); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 4px 14px rgb(0 0 0 / .4), var(--rim);
  white-space: pre-line; overflow-wrap: break-word;
  opacity: 0; transition: opacity .12s ease;
}
#tipchip.show { opacity: 1; }

.dbg-row { cursor: pointer; user-select: none; }
.dbg-row input { accent-color: var(--control); margin: 0; }
.dbg-stats {
  /* bottom margin clears the frame's edge-resize band, which was sitting on
     the last line (the last line could not be scrolled into view) */
  margin: 2px 0 8px; padding: 6px 7px; font: var(--fs-xs)/1.45 ui-monospace, monospace;
  color: var(--dim); background: rgba(0,0,0,0.25); border-radius: 5px;
  white-space: pre; overflow-x: auto;
}

/* schema panels — a frame body declared as FIELDS (panels.js); the same
   fields paint a VR quad (xrpanels.js). Desktop renderer styles: */
.schema-panel { padding: 0; overflow: hidden; font-size: var(--fs-sm, 12px); }
.schema-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px; }
.sp-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
.sp-row.sp-f-list { flex-direction: column; align-items: stretch; }
.sp-label { color: var(--dim); min-width: 64px; flex-shrink: 0; }
.sp-info { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sp-step { display: inline-flex; align-items: center; gap: 2px; }
.sp-bump { width: 22px; padding: 2px 0; background: var(--well); border: none; color: var(--fg); border-radius: 4px; cursor: pointer; }
.sp-bump:hover { background: var(--act); }

<script>
// The early socket (TEL0S_NOTES §4): open the wire and send the join NOW —
// inline, zero imports, before the module graph is even requested — so the
// snapshot downloads while the 2.1MB engine parses and the GPU wakes.
// net.js ADOPTS this socket at connect() only if the join it sent is
// byte-for-byte the one net would send; any mismatch closes it unadopted.
// Inline rather than a file: a separate script would cost a blocking fetch
// on exactly the RTT this exists to save. Eligibility is the common
// returning-resident path only — first-run visitors get the door first,
// spectators/renderers take the normal path, ?earlysock=0 disables.
(() => {
  try {
    const params = new URLSearchParams(location.search);
    // Resolve the avatar FIRST and publish it, before any guard can return. net.js only
    // adopts this socket when the join it would send is byte-identical to the one sent
    // here, and lite.js is a second entry point that has to produce that same join
    // without loading an avatar it cannot draw. It asking for '' is what made the
    // adoption miss and produced arrive -> leave -> arrive (#188 B1). One resolution,
    // one reader, agreement by construction rather than by two copies staying in step.
    const wantName = params.get('avatar') || localStorage.getItem('ew-avatar-name') || 'claude';
    let wantAvatar = wantName;   // a bare name: the server resolves it against the roster
    try {
      const cached = JSON.parse(localStorage.getItem('ew-avatar-path') ?? 'null');
      if (cached && cached.name === wantName && typeof cached.path === 'string') wantAvatar = cached.path;
    } catch (e) { /* a bare name is fine */ }
    globalThis.__ewWantAvatar = wantAvatar;

    if (params.get('earlysock') === '0') return;
    if (params.has('spectate') || params.has('renderer') || params.has('mintthumbs')) return;
    const name = params.get('name')
      || (localStorage.getItem('ew-name-set') === '1' ? localStorage.getItem('ew-name') : null);
    if (!name) return;   // the first-run door decides identity — never preempt it
    const world = params.get('world') || 'commons';
    const token = params.get('key') || localStorage.getItem('ew-key') || '';
    const avatar = wantAvatar;   // resolved above, and published for lite.js to match
    const sent = { world, id: name, avatar, token };
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
    const stash = { ws, sent, buffered: [], failed: false, closeInfo: null };
    globalThis.__ewEarlySocket = stash;
    ws.onopen = () => ws.send(JSON.stringify({ type: 'join', world, id: name, avatar, spectate: false, renderer: false, token }));
    ws.onmessage = (ev) => {
      stash.buffered.push(ev.data);
      if (stash.buffered.length > 5000) {   // a runaway stream: bail to the normal path
        stash.failed = true;
        try { ws.close(); } catch (e) { /* dying */ }
      }

<script>
  // decideLite — the lite/full decision as ONE pure function, hung on globalThis so
  // tools/lite-choice-test.ts can run it against fabricated signals rather than
  // trying to fabricate a weak phone. Inline, and not a module, on purpose: it has
  // to answer BEFORE the module graph or the preloads below exist, and a <script
  // src> here would cost exactly the round trip those preloads exist to save.
  //
  // Lite is not a preference for people on slow connections — it is the only way in
  // for a device that cannot hold the engine in RAM at all. Owner's phone (Android,
  // Chrome) cannot boot the full client, full stop. So the order below puts what a
  // device has PROVEN above anything we infer about it, and puts what a person
  // asked for above both.
  (() => {
    // PER WORLD, because capability is a property of the pair, not the device. Measured
    // on a real phone (owner, Android/Chrome, 2026-09-15): an empty instance runs the
    // FULL client fine; the commons, with everyone's assets in it, is what kills the
    // browser. One global flag would answer "this device cannot" when the truth is
    // "this device cannot hold THAT world", and would strand a phone in lite on worlds
    // it handles comfortably.
    const tripKey = (params) => `ew-boot-attempt:${params.get('world') || 'default'}`;
    const retryKey = (params) => `ew-boot-retried:${params.get('world') || 'default'}`;   // a desktop's one retry (rule 2)
    globalThis.__ewRetryKey = retryKey;   // boot.js and litechoice.js clear it with the trip key
    globalThis.__ewTripKey = tripKey;   // boot.js disarms the same key

    const decideLite = ({ params, stored, lastBootDied, retried, deviceMemory, gpuApi, mobile }) => {

      //    way back for someone whose device just died mid-boot.
      if (params.has('lite')) return { lite: params.get('lite') !== '0', why: 'url' };
      // 2. The last full boot armed the tripwire and never came back to clear it.
      //    Whatever killed it — RAM, GPU, an OS that reaped the tab — this device has
      //    DEMONSTRATED it cannot, which beats every guess below. It is also the only
      //    signal that reaches iOS, where navigator.deviceMemory does not exist.
      //
      //    ABOVE the saved preference, deliberately: a saved 'full' plus a device that
      //    dies on full is a crash loop with no way out from inside the page, because
      //    the page never finishes loading to offer one. Evidence outranks a stale
      //    preference; (1) is still the override, and it is a URL, so it survives a
      //    browser that never got far enough to run any of our code.
      //
      //    PHONES AND TABLETS ONLY. Lite exists for a device that cannot hold the engine
      //    in RAM; a desktop or a headset can, and the things that leave this flag behind
      //    on one (a tab killed while a shader compiled, a browser force-quit, an OS
      //    update mid-load) say nothing about whether it fits. Demoting a desktop
      //    stranded people in the chat-only client with no idea how to get into the
      //    world (owner, 2026-10-01: "should only be default *on mobile*"). A desktop
      //    whose last boot died boots full again and is told so ('retry') - ONCE. If the retry dies too it never
      //    reaches main.js, where the pill offering lite lives, so a second death in a row lands in lite after all
      //    (review of #212: "the visitor has no in-page way out of the failed-boot cycle"), and lite's ∃ offers 3D
      //    again. A browser with no 3D API at all is told that, not retried.
      if (lastBootDied) {
        if (mobile || retried) return { lite: true, why: 'crash' };
        return gpuApi ? { lite: false, why: 'retry' } : { lite: true, why: 'no-gpu' };
      }
      // 3. A deliberate past choice outranks anything we merely infer below.
      if (stored === '1' || stored === '0') return { lite: stored === '1', why: 'saved' };
      // 4. No rendering API at all. Not a heuristic — a fact.
      if (!gpuApi) return { lite: true, why: 'no-gpu' };
      // 4b. A PHONE OR TABLET STARTS IN LITE (owner, 10-01: "why can't phones load the lite client by
      //     default?"). A phone visitor would rather start in chat than watch the world crash, and the
      //     ∃ logo there ("Tap the ∃ to load the full 3D world") is one press, saved per device (3) so it isn't asked again;
      //     a saved "3D" that then dies is caught by (2), once. Desktops and headsets start full.
      if (mobile) return { lite: true, why: 'phone' };

      //  that reports little memory is allowed to TRY - the tripwire catches it, and the pill offers lite.)
      return { lite: false, why: 'default' };

    // (Chromium: mobile is false on a desktop AND on a Quest), then the user agent:
    // Android (tablets omit "Mobile"), iPhone/iPod/iPad, and iPadOS, which reports a
    // Mac but has touch. A headset's browser can say Android and even Mobile (older Quest builds, Pico:
    // "Mobile VR Safari"), so a headset is excluded by name - it is
    // not a phone here - it needs the full client for VR. Unknown → not mobile: the
    // wrong guess in that direction costs a slow load, the other costs the world.

      if (nav.userAgentData && typeof nav.userAgentData.mobile === 'boolean' && nav.userAgentData.mobile) return true;

    // Arm the tripwire BEFORE a single engine byte is requested. boot.js disarms it once
    // the client has not only ARRIVED but gone quiet — deliberately not at finishBoot,
    // which fires when there is somewhere to stand and leaves the world's assets still
    // streaming. The phone that prompted all this survives the arrival on the commons
    // and dies during that tail, so a disarm at finishBoot would clear the flag moments
    // before the very crash it exists to catch.
    //
    // PAGEHIDE listens from the moment the flag is written, not from arrival: closing or
    // reloading a tab mid-load is a deliberate exit, and it used to trip the flag because
    // nothing was listening yet (the owner, 09-28: "I closed Chrome in the middle of
    // loading and it still dropped me down to the lite client"). An OOM kill or a hung
    // renderer runs no handler, so those still count. A bfcache restore re-arms, unless
    // boot.js has already disarmed for good.
    const armKey = tripKey(params);

      './node_modules/three/build/three.webgpu.js',
      './node_modules/three/build/three.tsl.js',
      './node_modules/three-mesh-bvh/build/index.module.js',
      './node_modules/@pixiv/three-vrm/lib/three-vrm.module.js',
      './node_modules/@pixiv/three-vrm-materials-mtoon/lib/three-vrm-materials-mtoon.module.js',
      './node_modules/@pixiv/three-vrm-materials-mtoon/lib/nodes/index.module.js',
      './node_modules/@pixiv/three-vrm-animation/lib/three-vrm-animation.module.js',

      l.rel = 'modulepreload';
      l.href = href;

         viewBox's 0.8 x-offset is the master's translate(-0.8 0). Plain paths, no clip on the frame, so
         the XR curtain (render.js) can fill them as Path2D and the veil can clone them. -->
    <path class="sp-frame" d="M23.347 18.5 L74 18.5 L74 38.5 L63 38.5 L63 29.5 L13.652 29.5 A40 40 0 0 1 23.347 18.5 Z"/>
    <path class="sp-frame" d="M13.652 70.5 L63 70.5 L63 61.5 L74 61.5 L74 81.5 L23.347 81.5 A40 40 0 0 1 13.652 70.5 Z"/>
    <clipPath id="sp-sphere"><circle cx="48" cy="50" r="40"/></clipPath>
    <!-- the peg exists only inside the sphere while it travels; boot.js drops the clip (and the
         transform) once it rests, so the loaded mark is exactly the still one -->
    <g class="sp-travel" clip-path="url(#sp-sphere)"><path class="sp-peg" style="transform: translateX(-80.5px)" d="M33.746 44.5 L87.620 44.5 A40 40 0 0 1 87.620 55.5 L33.746 55.5 A15.279 15.279 0 0 1 33.746 44.5 Z"/></g>

<script>
  // Boot watchdog — pre-module, zero imports. A failed or hanging module
  // graph (missing client/node_modules on a fresh clone, a browser without
  // WebGPU) used to leave this splash saying "waking the engine" forever,
  // name "…", nothing anywhere — the least debuggable failure the client
  // had. The truth now lands ON the splash: any uncaught error or
  // rejection before the engine marks itself up is shown, and twenty
  // silent seconds earn a diagnosis hint. core.js sets __ewEngineUp after
  // renderer.init() — module resolution AND the GPU both proven.
  (() => {
    const phase = () => document.querySelector('.sp-phase');
    const fail = (msg) => {
      const el = phase();
      if (globalThis.__ewEngineUp || !el) return;
      el.textContent = msg;
      el.style.color = '#ff9d8a';
    };
    addEventListener('error', (e) => fail(
      `the engine failed to load — ${e.message || (e.target && e.target.src) || 'see the console'}`));
    addEventListener('unhandledrejection', (e) => fail(
      `the engine failed to start — ${(e.reason && e.reason.message) || e.reason || 'see the console'}`));
    // An XR boot (?xr=1) asks for an XR-compatible GL context inside renderer.init(), and that call
    // blocks on the OpenXR runtime: SteamVR started after Chrome, or a runtime mid-handshake, hangs the
    // engine before ANY module can report (09-06 11:12–11:22, three loads, no console line). Name it early.
    const xrBoot = new URLSearchParams(location.search).has('xr');
    if (xrBoot) setTimeout(() => {
      if (globalThis.__ewEngineUp) return;
      fail('VR boot: waiting on the headset runtime for an XR-compatible GPU context (8 s). If SteamVR started after Chrome: chrome://restart, then this link again. To get in without VR, drop xr=1 from the URL.');
    }, 8000);
    setTimeout(() => {
      if (globalThis.__ewEngineUp) return;
      fail(xrBoot
        ? 'still no XR-compatible context after 20 s — chrome://restart with SteamVR already running, or drop xr=1 from the URL. F12 → Console shows what init is waiting on.'
        : 'still waking after 20s — open the console. Fresh checkout? run: cd client && bun install. The client needs WebGPU or WebGL 2 (current Chrome or Firefox).');
    }, 20000);
  })();
</script>
<script>
  // One entry point or the other, never both, chosen by the same flag the preloads
  // above read. main.js statically imports { THREE, scene, camera, renderer } at its
  // line 10, so lite CANNOT be a runtime branch inside it — the import is resolved
  // before a flag could be consulted. Two graphs, one shared lib/.
  (() => {
    const s = document.createElement('script');
    s.type = 'module';
    s.src = globalThis.__ewLite ? './lite.js' : './main.js';
    document.body.appendChild(s);
  })();
</script>
