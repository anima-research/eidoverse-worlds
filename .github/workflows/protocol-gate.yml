# The protocol gate (tools/protocol/run.ts) on Linux, macOS and Windows, at the exact head of every PR and push to main.
# Each OS uploads a JSON receipt: the head it ran, OS, runtimes, the pinned library's head, every suite's result and a hash
# of the output the verdict rests on (review of PR #260, rereview at 22494b2c: "a durable exact-head gate receipt").
name: protocol-gate
on:
  pull_request:
  push:
    # main, plus the protocol PR's own branch: a fork's Actions run on a push to the fork (the receipt for PR #260 comes
    # from there, since a pull_request from a fork may not run upstream without a maintainer's approval)
    branches: [main, protocol-v4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: check out bytes as committed (no CRLF conversion on Windows)
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diffcheck compares the range against main's merge-base
      - name: fetch main for the range check
        shell: bash
        # the PR's base is anima-research's main; a fork's own main can be months stale (10-19: Aug 3)
        run: git fetch --no-tags https://github.com/anima-research/eidoverse-worlds.git main:refs/remotes/anima/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python deps (the conformance suite)
        run: python -m pip install cryptography
      - name: install
        shell: bash
        run: |
          bun install --frozen-lockfile
          (cd client && bun install --frozen-lockfile)
          # mcpl/package.json takes two sibling repos by path (file:../../…); clone them where it looks, pinned.
          # The gate only reads net-server.ts as text, but bun install must still resolve them.
          git clone -q https://github.com/anima-research/agent-framework.git ../agent-framework
          git -C ../agent-framework checkout -q 2f05c28e1923b7d07c6c6322b871303bd0d2d8d5
          git clone -q https://github.com/anima-research/mcpl-core-ts.git ../mcpl-core-ts
          git -C ../mcpl-core-ts checkout -q e17f773a9247c41d5c872d760aac7f243748d134
          (cd mcpl && bun install --frozen-lockfile)
          # the project's own playwright, so the browser revision is the one run.ts's import of it looks for
          bun node_modules/playwright/cli.js install chromium
      - name: asset library (pinned in run.ts)
        shell: bash
        run: |
          pin=$(grep -oE 'LIBRARY_PIN = "[0-9a-f]{40}"' tools/protocol/run.ts | grep -oE '[0-9a-f]{40}')
          git clone --filter=blob:none https://github.com/SkyeShark/eidoverse-video.git "$RUNNER_TEMP/eidoverse-video"
          git -C "$RUNNER_TEMP/eidoverse-video" checkout "$pin"
      - name: gate
        shell: bash
        env:
          EIDOVERSE_DIR: ${{ runner.temp }}/eidoverse-video
          PROTOCOL_KEEP: "1"   # keep each suite's scratch so a failure's logs can be uploaded
          # extra flags for the harness's headless Chrome, CI only:
          #  Linux: Ubuntu 23.10+ disables the user namespaces Chrome's sandbox needs ("No usable sandbox!";
          #         playwright launches without it there for the same reason)
          #  macOS: the runner VM has no GPU; navigating to the client hung (10-19), so render in software
          EIDO_CHROME_ARGS: ${{ runner.os == 'Linux' && '--no-sandbox' || runner.os == 'macOS' && '--use-angle=swiftshader --enable-unsafe-swiftshader' || '' }}
        run: |
          # one known temp dir under /tmp so failed suites' scratch can be uploaded. With $RUNNER_TEMP/gate-tmp here,
          # browser-check (playwright) closed at launch on Linux, and passed with the default /tmp (10-19). Not the
          # socket-path limit: a CI-length path passes on Burrow. Cause unknown; /tmp/g is nearest the known-good setup.
          # Not on Windows: TEMP/TMP pointed elsewhere hung gov-reserved for 300 s with no output (cause unknown).
          if [ "$RUNNER_OS" != "Windows" ]; then mkdir -p /tmp/g; export TMPDIR=/tmp/g; fi
          bun tools/protocol/run.ts --receipt "gate-receipt-${{ matrix.os }}.json"
      - name: receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-receipt-${{ matrix.os }}
          path: gate-receipt-${{ matrix.os }}.json
          if-no-files-found: warn
      - name: scratch logs of failed suites
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-scratch-${{ matrix.os }}
          path: |
            /tmp/g/eido-gate-*/**/*.log
            /tmp/g/eido-gate-*/**/failure.jsonl
          if-no-files-found: ignore
