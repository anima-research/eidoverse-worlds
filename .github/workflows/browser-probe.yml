# Manual, fast loop for a browser-lane failure on one OS: one suite, its scratch kept and uploaded.
name: browser-probe
# Runs on a push to the branch `browser-probe`; set what to probe here.
on:
  push:
    branches: [browser-probe]
env:
  PROBE_SUITE: scripts   # a suite name (bun tools/protocol/run.ts --manifest): it runs in the gate's own hermetic env
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        chrome_args: [""]   # the harness now passes --use-mock-keychain itself on macOS (10-19)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - name: install
        shell: bash
        run: |
          bun install --frozen-lockfile
          (cd client && bun install --frozen-lockfile)
          bun tools/protocol/run.ts --siblings
          bun node_modules/playwright/cli.js install chromium
          pin=$(grep -oE 'LIBRARY_PIN = "[0-9a-f]{40}"' tools/protocol/run.ts | grep -oE '[0-9a-f]{40}')
          git clone -q --filter=blob:none https://github.com/SkyeShark/eidoverse-video.git "$RUNNER_TEMP/eidoverse-video"
          git -C "$RUNNER_TEMP/eidoverse-video" checkout -q "$pin"
      - name: probe
        id: probe
        shell: bash
        env:
          EIDOVERSE_DIR: ${{ runner.temp }}/eidoverse-video
          EIDO_CHROME_ARGS: ${{ matrix.chrome_args }}
          PROTOCOL_KEEP: "1"
        run: |
          # as protocol-gate.yml (its comment says why)
          if [ "$RUNNER_OS" != "Windows" ]; then mkdir -p /tmp/g; export TMPDIR=/tmp/g; fi
          bun -e 'const m = await import("./shared/protocol/sandbox.js"); console.log("SANDBOX available:", m.SANDBOX.available(), "isolated:", m.SANDBOX.isolated())' || true
          bun tools/protocol/run.ts "$PROBE_SUITE" --scratch-out "$GITHUB_OUTPUT"
      - if: always() && steps.probe.outputs.scratch != ''
        uses: actions/upload-artifact@v4
        with:
          name: probe-scratch-${{ strategy.job-index }}
          path: |
            ${{ steps.probe.outputs.scratch }}/**/*.log
            ${{ steps.probe.outputs.scratch }}/**/*.jsonl
          if-no-files-found: warn
